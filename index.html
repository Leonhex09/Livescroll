<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live TV Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #00c6ff;
    --secondary: #0072ff;
    --accent: #ff2d75;
    --dark: #0a0e17;
    --darker: #050811;
    --light: #ffffff;
    --gray: #8a8fa3;
    --success: #00ff88;
    --warning: #ffaa00;
    --error: #ff4444;
    --glass: rgba(255, 255, 255, 0.1);
    --glass-dark: rgba(0, 0, 0, 0.3);
    --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    --radius: 12px;
    --transition: all 0.3s ease;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--darker);
    color: var(--light);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Background Effects */
  .bg-effects {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, var(--primary), transparent);
    animation: float 15s infinite linear;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
  }

  /* Header */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10, 14, 23, 0.9);
    backdrop-filter: blur(20px);
    z-index: 1000;
    border-bottom: 1px solid rgba(0, 198, 255, 0.2);
    box-shadow: var(--shadow);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .logo i {
    font-size: 24px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .control-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid rgba(0, 198, 255, 0.2);
    color: var(--light);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }

  .control-btn:hover {
    background: var(--gradient);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4);
  }

  /* Search */
  .search-container {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    z-index: 1000;
    transition: var(--transition);
  }

  .search-container.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(-20px);
    pointer-events: none;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: 15px 20px;
    border: 2px solid rgba(0, 198, 255, 0.3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--light);
    font-size: 16px;
    outline: none;
  }

  .search-box input::placeholder {
    color: var(--gray);
  }

  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(10, 14, 23, 0.98);
    border-radius: 0 0 var(--radius) var(--radius);
    margin-top: -2px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    border: 2px solid rgba(0, 198, 255, 0.3);
    border-top: none;
  }

  .search-results.active {
    display: block;
  }

  .search-item {
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: var(--transition);
  }

  .search-item:hover {
    background: rgba(0, 198, 255, 0.1);
  }

  .search-item.active {
    background: var(--gradient);
  }

  /* Player Container - LANDSCAPE OPTIMIZED */
  .player-container {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Landscape mode adjustments */
  @media (orientation: landscape) and (max-height: 600px) {
    .channel-info {
      bottom: 80px !important;
      left: 20px !important;
    }
    
    .channel-name {
      font-size: 20px !important;
    }
    
    .player-controls {
      bottom: 15px !important;
      left: 15px !important;
      right: 15px !important;
      padding: 10px 15px !important;
    }
    
    .progress-container {
      bottom: 65px !important;
      left: 15px !important;
      right: 15px !important;
    }
    
    .header {
      padding: 10px 15px;
    }
    
    .logo {
      font-size: 18px;
    }
    
    .control-btn {
      width: 35px;
      height: 35px;
    }
  }

  /* Video Overlay */
  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, transparent 70%, rgba(0, 0, 0, 0.8));
    pointer-events: none;
    z-index: 2;
  }

  /* Channel Info */
  .channel-info {
    position: absolute;
    bottom: 100px;
    left: 30px;
    z-index: 3;
    pointer-events: none;
    transition: var(--transition);
  }

  .channel-name {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .channel-category {
    font-size: 16px;
    color: var(--gray);
    margin-bottom: 15px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--error);
    color: white;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* Loading Screen - FIXED HIDING ISSUE */
  .loading-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.5s ease, visibility 0.5s ease;
    opacity: 1;
    visibility: visible;
  }

  .loading-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loading-spinner {
    width: 60px;
    height: 60px;
    border: 4px solid transparent;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 18px;
    color: var(--gray);
    text-align: center;
  }

  .loading-details {
    font-size: 14px;
    color: var(--gray);
    margin-top: 10px;
    opacity: 0.7;
  }

  /* Player Controls */
  .player-controls {
    position: absolute;
    bottom: 30px;
    left: 30px;
    right: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    padding: 15px 20px;
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 4;
  }

  .player-container:hover .player-controls {
    opacity: 1;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .control-btn-large {
    width: 40px;
    height: 40px;
    background: var(--glass);
    border: 1px solid rgba(0, 198, 255, 0.2);
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }

  .control-btn-large:hover {
    background: var(--gradient);
    transform: scale(1.1);
  }

  .volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .volume-slider {
    width: 80px;
    height: 4px;
    -webkit-appearance: none;
    background: var(--gray);
    border-radius: 2px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
  }

  /* Quality Selector */
  .quality-selector {
    position: relative;
  }

  .quality-btn {
    background: var(--glass);
    border: 1px solid rgba(0, 198, 255, 0.3);
    color: white;
    padding: 8px 15px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
  }

  .quality-btn:hover {
    background: rgba(0, 198, 255, 0.2);
  }

  .quality-dropdown {
    position: absolute;
    bottom: 100%;
    right: 0;
    background: rgba(10, 14, 23, 0.95);
    border-radius: var(--radius);
    padding: 10px;
    min-width: 120px;
    display: none;
    box-shadow: var(--shadow);
    z-index: 5;
  }

  .quality-dropdown.active {
    display: block;
  }

  .quality-option {
    padding: 10px;
    cursor: pointer;
    border-radius: 6px;
    transition: var(--transition);
    font-size: 14px;
  }

  .quality-option:hover {
    background: rgba(0, 198, 255, 0.1);
  }

  .quality-option.active {
    background: var(--gradient);
  }

  /* Channel List */
  .channel-list-container {
    position: fixed;
    right: -400px;
    top: 0;
    width: 350px;
    height: 100vh;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    padding: 80px 20px 20px;
    overflow-y: auto;
    transition: right 0.3s ease;
    z-index: 900;
    border-left: 1px solid rgba(0, 198, 255, 0.2);
  }

  .channel-list-container.active {
    right: 0;
  }

  .channel-list-title {
    font-size: 20px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary);
  }

  .channel-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: var(--glass-dark);
    border-radius: var(--radius);
    margin-bottom: 10px;
    cursor: pointer;
    transition: var(--transition);
  }

  .channel-item:hover {
    background: rgba(0, 198, 255, 0.1);
    transform: translateX(-5px);
  }

  .channel-item.active {
    background: var(--gradient);
  }

  .channel-icon {
    width: 40px;
    height: 40px;
    background: var(--gradient);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .channel-item-info h4 {
    font-size: 16px;
    margin-bottom: 4px;
  }

  .channel-item-info p {
    font-size: 12px;
    color: var(--gray);
  }

  /* Progress Bar */
  .progress-container {
    position: absolute;
    bottom: 85px;
    left: 30px;
    right: 30px;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    overflow: hidden;
    z-index: 3;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .player-container:hover .progress-container {
    opacity: 1;
  }

  .progress-bar {
    height: 100%;
    background: var(--gradient);
    width: 0%;
    transition: width 0.1s ease;
  }

  /* Notification */
  .notification {
    position: fixed;
    top: 100px;
    right: 30px;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    padding: 15px 20px;
    border-radius: var(--radius);
    border-left: 4px solid var(--primary);
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 1001;
    transform: translateX(150%);
    transition: transform 0.3s ease;
    max-width: 350px;
  }

  .notification.show {
    transform: translateX(0);
  }

  .notification i {
    font-size: 20px;
  }

  .notification.success {
    border-left-color: var(--success);
  }

  .notification.error {
    border-left-color: var(--error);
  }

  .notification.warning {
    border-left-color: var(--warning);
  }

  /* Settings Modal */
  .settings-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .settings-modal.active {
    opacity: 1;
    pointer-events: all;
  }

  .settings-content {
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(30px);
    border-radius: var(--radius);
    padding: 30px;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .settings-title {
    font-size: 24px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .setting-group {
    margin-bottom: 25px;
  }

  .setting-label {
    display: block;
    margin-bottom: 10px;
    color: var(--gray);
  }

  .setting-select {
    width: 100%;
    padding: 12px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(0, 198, 255, 0.3);
    border-radius: var(--radius);
    color: white;
    font-size: 16px;
    outline: none;
  }

  /* Scroll Container */
  .scroll-container {
    height: 100vh;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overflow-y: scroll;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .scroll-container::-webkit-scrollbar {
    display: none;
  }

  /* Initial Loader */
  .initial-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--darker);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .initial-loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-logo {
    font-size: 48px;
    margin-bottom: 20px;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .loader-text {
    font-size: 18px;
    color: var(--gray);
    margin-bottom: 30px;
  }

  .loader-progress {
    width: 200px;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .loader-progress-bar {
    height: 100%;
    background: var(--gradient);
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Play button overlay for muted autoplay */
  .play-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
    visibility: hidden;
    transition: var(--transition);
  }

  .play-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .play-overlay-btn {
    width: 80px;
    height: 80px;
    background: var(--gradient);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    transition: var(--transition);
  }

  .play-overlay-btn:hover {
    transform: scale(1.1);
  }

  .play-overlay-text {
    margin-top: 20px;
    font-size: 18px;
    text-align: center;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .channel-info {
      bottom: 140px;
      left: 20px;
    }

    .channel-name {
      font-size: 22px;
    }

    .player-controls {
      bottom: 20px;
      left: 20px;
      right: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progress-container {
      bottom: 75px;
      left: 20px;
      right: 20px;
    }

    .channel-list-container {
      width: 100%;
      right: -100%;
    }

    .notification {
      left: 20px;
      right: 20px;
      max-width: none;
    }
  }

  /* Fullscreen styles */
  :fullscreen .header,
  :fullscreen .search-container,
  :fullscreen .channel-list-container,
  :fullscreen .notification,
  :fullscreen .initial-loader {
    display: none;
  }

  :fullscreen .player-container {
    height: 100vh;
  }

  :fullscreen video {
    object-fit: contain;
  }
</style>
</head>
<body>

<!-- Initial Loader -->
<div class="initial-loader" id="initialLoader">
  <div class="loader-logo">
    <i class="fas fa-satellite-dish"></i>
  </div>
  <div class="loader-text" id="loaderText">Loading channels...</div>
  <div class="loader-progress">
    <div class="loader-progress-bar" id="loaderProgress"></div>
  </div>
</div>

<!-- Background Effects -->
<div class="bg-effects" id="bgEffects"></div>

<!-- Header -->
<header class="header">
  <div class="logo">
    <i class="fas fa-satellite"></i>
    <span>LiveStream</span>
  </div>
  
  <div class="header-controls">
    <button class="control-btn" id="btnSearch" title="Search">
      <i class="fas fa-search"></i>
    </button>
    <button class="control-btn" id="btnChannels" title="Channel List">
      <i class="fas fa-list"></i>
    </button>
    <button class="control-btn" id="btnSettings" title="Settings">
      <i class="fas fa-cog"></i>
    </button>
    <button class="control-btn" id="btnFullscreen" title="Fullscreen">
      <i class="fas fa-expand"></i>
    </button>
  </div>
</header>

<!-- Search -->
<div class="search-container hidden" id="searchContainer">
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search channels...">
    <button class="control-btn" id="btnCloseSearch">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- Channel List Sidebar -->
<div class="channel-list-container" id="channelList">
  <h3 class="channel-list-title">Channels</h3>
  <div id="channelItems"></div>
</div>

<!-- Settings Modal -->
<div class="settings-modal" id="settingsModal">
  <div class="settings-content">
    <div class="settings-title">
      <span>Settings</span>
      <button class="control-btn" id="btnCloseSettings">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Video Quality</label>
      <select class="setting-select" id="qualitySelect">
        <option value="auto">Auto (Recommended)</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Buffer Size</label>
      <select class="setting-select" id="bufferSelect">
        <option value="5">Very Low (5s) - Fastest</option>
        <option value="10">Low (10s)</option>
        <option value="15" selected>Medium (15s)</option>
        <option value="30">High (30s)</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Autoplay Next Channel</label>
      <select class="setting-select" id="autoplaySelect">
        <option value="yes" selected>Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Default Volume</label>
      <input type="range" min="0" max="100" value="70" class="volume-slider" id="defaultVolume">
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Start Muted (Recommended)</label>
      <select class="setting-select" id="startMutedSelect">
        <option value="yes" selected>Yes - Avoid autoplay restrictions</option>
        <option value="no">No</option>
      </select>
    </div>
    
    <button class="quality-btn" id="btnSaveSettings" style="width: 100%; margin-top: 20px;">
      Save Settings
    </button>
  </div>
</div>

<!-- Notification -->
<div class="notification" id="notification">
  <i class="fas fa-info-circle"></i>
  <span id="notificationText">Notification message</span>
</div>

<!-- Main Container -->
<div class="scroll-container" id="scrollContainer">
  <div id="playerSections"></div>
</div>

<script>
// Global variables
let channels = [];
let currentChannelIndex = 0;
let hlsInstances = new Map();
let playerSettings = {
  quality: 'auto',
  buffer: 15, // Reduced for faster start
  autoplay: true,
  volume: 70,
  startMuted: true,
  lowLatency: true
};
let isScrolling = false;
let isLoadingTimeout = null;

// Initialize background particles
function initParticles() {
  const container = document.getElementById('bgEffects');
  for (let i = 0; i < 30; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.width = `${Math.random() * 5 + 2}px`;
    particle.style.height = particle.style.width;
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.animationDelay = `${Math.random() * 15}s`;
    particle.style.opacity = Math.random() * 0.3 + 0.1;
    container.appendChild(particle);
  }
}

// Show notification
function showNotification(message, type = 'info', duration = 3000) {
  const notification = document.getElementById('notification');
  const text = document.getElementById('notificationText');
  const icon = notification.querySelector('i');
  
  notification.className = 'notification';
  notification.classList.add(type);
  notification.classList.add('show');
  
  text.textContent = message;
  
  // Set icon based on type
  switch(type) {
    case 'success':
      icon.className = 'fas fa-check-circle';
      break;
    case 'error':
      icon.className = 'fas fa-exclamation-circle';
      break;
    case 'warning':
      icon.className = 'fas fa-exclamation-triangle';
      break;
    default:
      icon.className = 'fas fa-info-circle';
  }
  
  setTimeout(() => {
    notification.classList.remove('show');
  }, duration);
}

// Hide loading screen for a specific video
function hideLoadingScreen(videoId) {
  const loadingScreen = document.querySelector(`#video-${videoId}`).closest('.player-container').querySelector('.loading-screen');
  if (loadingScreen) {
    loadingScreen.classList.add('hidden');
  }
}

// Show loading screen for a specific video
function showLoadingScreen(videoId, message = 'Loading...') {
  const loadingScreen = document.querySelector(`#video-${videoId}`).closest('.player-container').querySelector('.loading-screen');
  if (loadingScreen) {
    loadingScreen.classList.remove('hidden');
    loadingScreen.querySelector('.loading-text').textContent = message;
  }
}

// Universal video player with faster loading
function createVideoPlayer(videoElement, url, channelId) {
  // Clear any existing timeout
  if (isLoadingTimeout) {
    clearTimeout(isLoadingTimeout);
  }
  
  // Show loading screen
  showLoadingScreen(channelId, 'Connecting to stream...');
  
  // Destroy existing HLS instance
  if (hlsInstances.has(videoElement)) {
    const oldHls = hlsInstances.get(videoElement);
    oldHls.destroy();
    hlsInstances.delete(videoElement);
  }
  
  // Set video volume from settings
  videoElement.volume = playerSettings.volume / 100;
  
  // Start muted if setting is enabled (for autoplay)
  videoElement.muted = playerSettings.startMuted;
  
  // Try HLS.js first
  if (Hls.isSupported() && url.includes('.m3u8')) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: playerSettings.lowLatency,
      backBufferLength: 10,
      maxBufferLength: playerSettings.buffer,
      maxMaxBufferLength: playerSettings.buffer * 2,
      maxBufferSize: 30 * 1000 * 1000, // 30MB max
      liveSyncDurationCount: 2, // Faster sync to live edge
      liveMaxLatencyDurationCount: 5,
      fragLoadingTimeOut: 5000, // Reduced timeout
      manifestLoadingTimeOut: 5000,
      levelLoadingTimeOut: 5000,
      fragLoadingMaxRetry: 3,
      manifestLoadingMaxRetry: 3,
      levelLoadingMaxRetry: 3,
      abrMaxWithRealBitrate: true,
      startLevel: -1,
      capLevelToPlayerSize: true,
      testBandwidth: true,
      bandwidthEstimate: 1000000, // Start with 1Mbps estimate
      // Optimized for faster start
      startFragPrefetch: true,
      autoStartLoad: true,
      initialLiveManifestSize: 1
    });
    
    hls.loadSource(url);
    hls.attachMedia(videoElement);
    
    // Handle successful loading
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      console.log(`Channel ${channelId}: Manifest parsed`);
      showLoadingScreen(channelId, 'Buffering stream...');
    });
    
    hls.on(Hls.Events.LEVEL_LOADED, () => {
      console.log(`Channel ${channelId}: Level loaded`);
    });
    
    hls.on(Hls.Events.FRAG_LOADED, () => {
      console.log(`Channel ${channelId}: Fragment loaded`);
    });
    
    // Hide loading when video starts playing
    videoElement.addEventListener('playing', () => {
      console.log(`Channel ${channelId}: Video playing`);
      hideLoadingScreen(channelId);
      showNotification(`Now playing: ${channels.find(c => c.id === channelId)?.name}`, 'success', 2000);
    });
    
    videoElement.addEventListener('canplay', () => {
      console.log(`Channel ${channelId}: Video can play`);
      // Auto-hide loading after 3 seconds if still showing
      isLoadingTimeout = setTimeout(() => {
        hideLoadingScreen(channelId);
      }, 3000);
    });
    
    videoElement.addEventListener('waiting', () => {
      console.log(`Channel ${channelId}: Video waiting`);
      showLoadingScreen(channelId, 'Buffering...');
    });
    
    videoElement.addEventListener('stalled', () => {
      console.log(`Channel ${channelId}: Video stalled`);
      showLoadingScreen(channelId, 'Reconnecting...');
    });
    
    hls.on(Hls.Events.ERROR, (event, data) => {
      console.error(`Channel ${channelId}: HLS Error`, data);
      
      if (data.fatal) {
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            showLoadingScreen(channelId, 'Network error - retrying...');
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            showLoadingScreen(channelId, 'Media error - recovering...');
            hls.recoverMediaError();
            break;
          default:
            showLoadingScreen(channelId, 'Stream error - trying fallback...');
            hls.destroy();
            // Try native playback
            videoElement.src = url;
            videoElement.load();
        }
      }
    });
    
    hlsInstances.set(videoElement, hls);
    return hls;
  } 
  // Native HLS support (Safari)
  else if (videoElement.canPlayType('application/vnd.apple.mpegurl') && url.includes('.m3u8')) {
    videoElement.src = url;
    
    // Add event listeners for native playback
    videoElement.addEventListener('loadedmetadata', () => {
      console.log(`Channel ${channelId}: Metadata loaded`);
      showLoadingScreen(channelId, 'Ready to play...');
    });
    
    videoElement.addEventListener('playing', () => {
      console.log(`Channel ${channelId}: Video playing`);
      hideLoadingScreen(channelId);
      showNotification(`Now playing: ${channels.find(c => c.id === channelId)?.name}`, 'success', 2000);
    });
    
    videoElement.addEventListener('waiting', () => {
      showLoadingScreen(channelId, 'Buffering...');
    });
    
    videoElement.addEventListener('error', (e) => {
      console.error(`Channel ${channelId}: Native playback error`, e);
      showLoadingScreen(channelId, 'Playback error');
    });
    
    return null;
  }
  // Fallback for other formats
  else {
    videoElement.src = url;
    
    videoElement.addEventListener('canplay', () => {
      console.log(`Channel ${channelId}: Video can play`);
      hideLoadingScreen(channelId);
    });
    
    videoElement.addEventListener('playing', () => {
      console.log(`Channel ${channelId}: Video playing`);
      hideLoadingScreen(channelId);
      showNotification(`Now playing: ${channels.find(c => c.id === channelId)?.name}`, 'success', 2000);
    });
    
    videoElement.addEventListener('waiting', () => {
      showLoadingScreen(channelId, 'Buffering...');
    });
    
    return null;
  }
}

// Enhanced channel loader
async function loadChannels() {
  const loader = document.getElementById('initialLoader');
  const loaderText = document.getElementById('loaderText');
  const loaderProgress = document.getElementById('loaderProgress');
  
  try {
    loaderText.textContent = 'Fetching channel list...';
    loaderProgress.style.width = '30%';
    
    const response = await fetch('channels.json');
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    loaderText.textContent = 'Parsing channel data...';
    loaderProgress.style.width = '60%';
    
    const data = await response.json();
    
    // Validate channel data structure
    if (!Array.isArray(data)) {
      throw new Error('channels.json must contain an array of channels');
    }
    
    // Filter out invalid channels
    channels = data.filter(channel => {
      return channel && 
             channel.name && 
             channel.url && 
             channel.url.trim() !== '';
    }).map((channel, index) => ({
      ...channel,
      id: channel.id || index + 1,
      category: channel.category || 'General',
      logo: channel.logo || '📺',
      description: channel.description || 'Live TV Channel'
    }));
    
    if (channels.length === 0) {
      throw new Error('No valid channels found in channels.json');
    }
    
    loaderText.textContent = `Loaded ${channels.length} channels`;
    loaderProgress.style.width = '90%';
    
    setTimeout(() => {
      loader.classList.add('hidden');
      showNotification(`Loaded ${channels.length} channels`, 'success', 2000);
    }, 500);
    
    renderChannels();
    return channels;
    
  } catch (error) {
    console.error('Error loading channels:', error);
    
    loaderText.textContent = 'Error loading channels';
    loaderProgress.style.width = '100%';
    
    setTimeout(() => {
      loader.classList.add('hidden');
      showNotification(`Failed to load channels: ${error.message}`, 'error', 5000);
    }, 1000);
    
    // Fallback to demo channels
    channels = [
      {
        id: 1,
        name: "Demo Channel 1",
        category: "Entertainment",
        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        logo: "📺",
        description: "Sample stream for testing"
      },
      {
        id: 2,
        name: "Demo Channel 2",
        category: "News",
        url: "https://mnmedias.api.telequebec.tv/m3u8/29880.m3u8",
        logo: "📡",
        description: "Another test stream"
      }
    ];
    
    setTimeout(() => {
      renderChannels();
      showNotification('Using demo channels. Please check channels.json format.', 'warning', 5000);
    }, 1500);
    
    return channels;
  }
}

// Render all channels with optimized loading
function renderChannels() {
  const container = document.getElementById('playerSections');
  const channelList = document.getElementById('channelItems');
  
  container.innerHTML = '';
  channelList.innerHTML = '';
  
  if (channels.length === 0) {
    container.innerHTML = `
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--gray);">
        <div style="text-align: center;">
          <i class="fas fa-tv" style="font-size: 48px; margin-bottom: 20px;"></i>
          <h3>No channels available</h3>
          <p>Please check your channels.json file</p>
        </div>
      </div>
    `;
    return;
  }
  
  channels.forEach((channel, index) => {
    // Create player section
    const section = document.createElement('div');
    section.className = 'player-container';
    section.dataset.channelId = channel.id;
    section.id = `channel-${channel.id}`;
    
    section.innerHTML = `
      <div class="video-wrapper">
        <video 
          id="video-${channel.id}"
          playsinline 
          webkit-playsinline 
          preload="none"  <!-- Changed to none for faster initial load -->
          poster="${channel.poster || ''}"
        ></video>
        
        <div class="video-overlay"></div>
        
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading ${channel.name}...</div>
          <div class="loading-details" id="loading-details-${channel.id}"></div>
        </div>
        
        <!-- Play overlay for muted autoplay -->
        <div class="play-overlay" id="play-overlay-${channel.id}">
          <div class="play-overlay-btn" onclick="unmuteAndPlay(${channel.id})">
            <i class="fas fa-play"></i>
          </div>
          <div class="play-overlay-text">
            Click to start playback
            ${playerSettings.startMuted ? '<br><small>(Muted for autoplay)</small>' : ''}
          </div>
        </div>
        
        <div class="channel-info">
          <div class="channel-name">${channel.name}</div>
          <div class="channel-category">${channel.category}</div>
          <div class="live-badge">
            <i class="fas fa-circle"></i>
            LIVE
          </div>
        </div>
        
        <div class="progress-container">
          <div class="progress-bar" id="progress-${channel.id}"></div>
        </div>
        
        <div class="player-controls">
          <div class="control-group">
            <button class="control-btn-large" id="play-btn-${channel.id}" onclick="togglePlayPause(${channel.id})">
              <i class="fas fa-play" id="play-icon-${channel.id}"></i>
            </button>
            <button class="control-btn-large" id="mute-btn-${channel.id}" onclick="muteUnmute(${channel.id})">
              <i class="fas fa-volume-up" id="mute-icon-${channel.id}"></i>
            </button>
            <div class="volume-container">
              <input type="range" min="0" max="100" value="${playerSettings.volume}" 
                     class="volume-slider" 
                     id="volume-slider-${channel.id}"
                     oninput="setVolume(${channel.id}, this.value)">
            </div>
          </div>
          
          <div class="control-group">
            <div class="quality-selector">
              <button class="quality-btn" onclick="toggleQualityDropdown(${channel.id})">
                <i class="fas fa-cog"></i>
                Quality
              </button>
              <div class="quality-dropdown" id="quality-${channel.id}">
                <div class="quality-option" onclick="setQuality(${channel.id}, 'auto')">Auto</div>
                <div class="quality-option" onclick="setQuality(${channel.id}, '1080')">1080p</div>
                <div class="quality-option" onclick="setQuality(${channel.id}, '720')">720p</div>
                <div class="quality-option" onclick="setQuality(${channel.id}, '480')">480p</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(section);
    
    // Create channel list item
    const listItem = document.createElement('div');
    listItem.className = 'channel-item';
    if (index === 0) listItem.classList.add('active');
    listItem.onclick = () => switchToChannel(index);
    
    listItem.innerHTML = `
      <div class="channel-icon">
        ${channel.logo}
      </div>
      <div class="channel-item-info">
        <h4>${channel.name}</h4>
        <p>${channel.category}</p>
      </div>
    `;
    
    channelList.appendChild(listItem);
    
    // Initialize video player with staggered loading
    setTimeout(() => {
      const video = document.getElementById(`video-${channel.id}`);
      if (video && channel.url) {
        // Set initial volume
        video.volume = playerSettings.volume / 100;
        video.muted = playerSettings.startMuted;
        
        // Create player
        createVideoPlayer(video, channel.url, channel.id);
        
        // Try to play if it's the first channel
        if (index === 0 && playerSettings.autoplay) {
          setTimeout(() => {
            video.play().catch(error => {
              console.log(`Autoplay prevented for channel ${channel.id}:`, error);
              // Show play overlay
              document.getElementById(`play-overlay-${channel.id}`).classList.add('active');
            });
          }, 1000);
        }
        
        // Update progress bar
        video.addEventListener('timeupdate', () => {
          const progress = document.getElementById(`progress-${channel.id}`);
          if (progress && video.duration) {
            const percent = (video.currentTime / video.duration) * 100;
            progress.style.width = `${percent}%`;
          }
        });
        
        // Update play/pause button
        video.addEventListener('play', () => {
          const icon = document.getElementById(`play-icon-${channel.id}`);
          if (icon) icon.className = 'fas fa-pause';
          // Hide play overlay
          document.getElementById(`play-overlay-${channel.id}`).classList.remove('active');
        });
        
        video.addEventListener('pause', () => {
          const icon = document.getElementById(`play-icon-${channel.id}`);
          if (icon) icon.className = 'fas fa-play';
        });
        
        // Update mute button
        video.addEventListener('volumechange', () => {
          const icon = document.getElementById(`mute-icon-${channel.id}`);
          if (icon) {
            icon.className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
          }
          const slider = document.getElementById(`volume-slider-${channel.id}`);
          if (slider) {
            slider.value = video.muted ? 0 : video.volume * 100;
          }
        });
      }
    }, 300 * index); // Stagger loading
  });
  
  // Setup scroll snapping
  setupScrollSnap();
}

// Unmute and play function
function unmuteAndPlay(channelId) {
  const video = document.getElementById(`video-${channelId}`);
  const overlay = document.getElementById(`play-overlay-${channelId}`);
  
  if (video) {
    video.muted = false;
    video.play().then(() => {
      overlay.classList.remove('active');
      showNotification('Playback started', 'success', 2000);
    }).catch(error => {
      console.error('Play failed:', error);
      showNotification('Click the play button to start', 'info');
    });
  }
}

// Setup scroll snapping
function setupScrollSnap() {
  const container = document.getElementById('scrollContainer');
  const sections = document.querySelectorAll('.player-container');
  
  let scrollTimeout;
  container.addEventListener('scroll', () => {
    if (isScrolling) return;
    
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      sections.forEach((section, index) => {
        const rect = section.getBoundingClientRect();
        if (rect.top >= 0 && rect.top < window.innerHeight / 2) {
          if (index !== currentChannelIndex) {
            switchToChannel(index);
          }
        }
      });
    }, 100);
  });
}

// Switch to channel with optimized loading
function switchToChannel(index) {
  if (index < 0 || index >= channels.length) return;
  
  currentChannelIndex = index;
  const channel = channels[index];
  
  // Update active channel in list
  document.querySelectorAll('.channel-item').forEach((item, i) => {
    item.classList.toggle('active', i === index);
  });
  
  // Scroll to channel
  const section = document.getElementById(`channel-${channel.id}`);
  if (section) {
    isScrolling = true;
    section.scrollIntoView({ behavior: 'smooth' });
    
    setTimeout(() => {
      isScrolling = false;
    }, 500);
  }
  
  // Play video if autoplay is enabled
  if (playerSettings.autoplay) {
    setTimeout(() => {
      const video = document.getElementById(`video-${channel.id}`);
      if (video) {
        // Preload the video
        video.preload = 'auto';
        
        // Try to play
        video.play().catch(error => {
          console.log('Autoplay prevented:', error);
          // Show play overlay for muted autoplay
          const overlay = document.getElementById(`play-overlay-${channel.id}`);
          if (overlay) overlay.classList.add('active');
        });
      }
    }, 300);
  }
  
  showNotification(`Switched to ${channel.name}`);
}

// Toggle play/pause
function togglePlayPause(channelId) {
  const video = document.getElementById(`video-${channelId}`);
  
  if (video.paused) {
    video.play().catch(error => {
      console.error('Play failed:', error);
      showNotification('Click to unmute and play', 'info');
    });
  } else {
    video.pause();
  }
}

// Mute/unmute
function muteUnmute(channelId) {
  const video = document.getElementById(`video-${channelId}`);
  video.muted = !video.muted;
}

// Set volume
function setVolume(channelId, value) {
  const video = document.getElementById(`video-${channelId}`);
  video.volume = value / 100;
  video.muted = value === 0;
}

// Toggle quality dropdown
function toggleQualityDropdown(channelId) {
  const dropdown = document.getElementById(`quality-${channelId}`);
  dropdown.classList.toggle('active');
}

// Set quality
function setQuality(channelId, quality) {
  const video = document.getElementById(`video-${channelId}`);
  const hls = hlsInstances.get(video);
  
  if (hls) {
    if (quality === 'auto') {
      hls.currentLevel = -1;
    } else {
      const levels = hls.levels;
      const targetLevel = levels.findIndex(level => 
        level.height <= parseInt(quality)
      );
      if (targetLevel !== -1) {
        hls.currentLevel = targetLevel;
      }
    }
  }
  
  showNotification(`Quality set to ${quality}`);
  toggleQualityDropdown(channelId);
}

// Search functionality
function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const searchContainer = document.getElementById('searchContainer');
  const btnSearch = document.getElementById('btnSearch');
  const btnCloseSearch = document.getElementById('btnCloseSearch');
  
  btnSearch.addEventListener('click', () => {
    searchContainer.classList.toggle('hidden');
    if (!searchContainer.classList.contains('hidden')) {
      searchInput.focus();
    }
  });
  
  btnCloseSearch.addEventListener('click', () => {
    searchContainer.classList.add('hidden');
    searchResults.classList.remove('active');
  });
  
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    
    if (query.length === 0) {
      searchResults.classList.remove('active');
      return;
    }
    
    const filtered = channels.filter(channel =>
      channel.name.toLowerCase().includes(query) ||
      (channel.category && channel.category.toLowerCase().includes(query)) ||
      (channel.description && channel.description.toLowerCase().includes(query))
    );
    
    if (filtered.length > 0) {
      filtered.forEach(channel => {
        const index = channels.findIndex(c => c.id === channel.id);
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `
          <strong>${channel.name}</strong>
          <small>${channel.category}</small>
        `;
        item.onclick = () => {
          switchToChannel(index);
          searchContainer.classList.add('hidden');
          searchResults.classList.remove('active');
          searchInput.value = '';
        };
        searchResults.appendChild(item);
      });
      searchResults.classList.add('active');
    } else {
      const item = document.createElement('div');
      item.className = 'search-item';
      item.innerHTML = '<em>No channels found</em>';
      searchResults.appendChild(item);
      searchResults.classList.add('active');
    }
  });
  
  // Close search when clicking outside
  document.addEventListener('click', (e) => {
    if (!searchContainer.contains(e.target) && !btnSearch.contains(e.target)) {
      searchContainer.classList.add('hidden');
      searchResults.classList.remove('active');
    }
  });
}

// Settings functionality
function setupSettings() {
  const settingsModal = document.getElementById('settingsModal');
  const btnSettings = document.getElementById('btnSettings');
  const btnCloseSettings = document.getElementById('btnCloseSettings');
  const btnSaveSettings = document.getElementById('btnSaveSettings');
  
  // Load saved settings
  const savedSettings = localStorage.getItem('liveTvSettings');
  if (savedSettings) {
    Object.assign(playerSettings, JSON.parse(savedSettings));
  }
  
  // Apply loaded settings to UI
  document.getElementById('qualitySelect').value = playerSettings.quality;
  document.getElementById('bufferSelect').value = playerSettings.buffer;
  document.getElementById('autoplaySelect').value = playerSettings.autoplay ? 'yes' : 'no';
  document.getElementById('defaultVolume').value = playerSettings.volume;
  document.getElementById('startMutedSelect').value = playerSettings.startMuted ? 'yes' : 'no';
  
  btnSettings.addEventListener('click', () => {
    settingsModal.classList.add('active');
  });
  
  btnCloseSettings.addEventListener('click', () => {
    settingsModal.classList.remove('active');
  });
  
  btnSaveSettings.addEventListener('click', () => {
    playerSettings.quality = document.getElementById('qualitySelect').value;
    playerSettings.buffer = parseInt(document.getElementById('bufferSelect').value);
    playerSettings.autoplay = document.getElementById('autoplaySelect').value === 'yes';
    playerSettings.volume = parseInt(document.getElementById('defaultVolume').value);
    playerSettings.startMuted = document.getElementById('startMutedSelect').value === 'yes';
    
    localStorage.setItem('liveTvSettings', JSON.stringify(playerSettings));
    
    // Apply volume to all videos
    document.querySelectorAll('video').forEach(video => {
      video.volume = playerSettings.volume / 100;
      video.muted = playerSettings.startMuted;
    });
    
    settingsModal.classList.remove('active');
    showNotification('Settings saved successfully', 'success');
  });
  
  // Close modal when clicking outside
  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) {
      settingsModal.classList.remove('active');
    }
  });
}

// Fullscreen functionality
function setupFullscreen() {
  const btnFullscreen = document.getElementById('btnFullscreen');
  
  btnFullscreen.addEventListener('click', () => {
    const container = document.getElementById('scrollContainer');
    
    if (!document.fullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
      }
      btnFullscreen.innerHTML = '<i class="fas fa-compress"></i>';
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
      btnFullscreen.innerHTML = '<i class="fas fa-expand"></i>';
    }
  });
  
  document.addEventListener('fullscreenchange', updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
  document.addEventListener('msfullscreenchange', updateFullscreenButton);
  
  function updateFullscreenButton() {
    btnFullscreen.innerHTML = document.fullscreenElement ? 
      '<i class="fas fa-compress"></i>' : 
      '<i class="fas fa-expand"></i>';
  }
}

// Channel list sidebar
function setupChannelList() {
  const btnChannels = document.getElementById('btnChannels');
  const channelList = document.getElementById('channelList');
  
  btnChannels.addEventListener('click', () => {
    channelList.classList.toggle('active');
  });
  
  // Close when clicking outside on mobile
  if (window.innerWidth <= 768) {
    document.addEventListener('click', (e) => {
      if (!channelList.contains(e.target) && !btnChannels.contains(e.target)) {
        channelList.classList.remove('active');
      }
    });
  }
}

// Initialize everything
document.addEventListener('DOMContentLoaded', () => {
  initParticles();
  loadChannels();
  setupSearch();
  setupSettings();
  setupFullscreen();
  setupChannelList();
  
  // Load any popup message
  fetch('message.json')
    .then(res => {
      if (res.ok) return res.json();
      throw new Error('No message file found');
    })
    .then(msg => {
      if (msg && msg.enabled) {
        setTimeout(() => {
          showNotification(msg.message || 'Welcome to LiveStream!', msg.type || 'info', 5000);
        }, 3000);
      }
    })
    .catch(() => {});
  
  // Handle beforeunload to clean up HLS instances
  window.addEventListener('beforeunload', () => {
    hlsInstances.forEach(hls => hls.destroy());
    if (isLoadingTimeout) clearTimeout(isLoadingTimeout);
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Spacebar to play/pause current video
  if (e.code === 'Space' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    const currentVideo = document.getElementById(`video-${channels[currentChannelIndex].id}`);
    if (currentVideo) {
      togglePlayPause(channels[currentChannelIndex].id);
    }
  }
  
  // Arrow keys for navigation
  if (e.code === 'ArrowDown') {
    e.preventDefault();
    switchToChannel(Math.min(currentChannelIndex + 1, channels.length - 1));
  }
  
  if (e.code === 'ArrowUp') {
    e.preventDefault();
    switchToChannel(Math.max(currentChannelIndex - 1, 0));
  }
  
  // F for fullscreen
  if (e.code === 'KeyF' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    document.getElementById('btnFullscreen').click();
  }
  
  // M for mute
  if (e.code === 'KeyM' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    const currentVideo = document.getElementById(`video-${channels[currentChannelIndex].id}`);
    if (currentVideo) {
      muteUnmute(channels[currentChannelIndex].id);
    }
  }
  
  // Escape to close modals
  if (e.code === 'Escape') {
    document.getElementById('searchContainer').classList.add('hidden');
    document.getElementById('settingsModal').classList.remove('active');
    document.getElementById('channelList').classList.remove('active');
  }
});

// Add reload channels function (accessible from console)
window.reloadChannels = async function() {
  showNotification('Reloading channels...', 'info');
  await loadChannels();
};

// Handle device orientation changes for landscape mode
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    // Force redraw for landscape adjustments
    window.dispatchEvent(new Event('resize'));
  }, 300);
});
