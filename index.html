<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live TV Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #00c6ff;
    --secondary: #0072ff;
    --accent: #ff2d75;
    --dark: #0a0e17;
    --darker: #050811;
    --light: #ffffff;
    --gray: #8a8fa3;
    --success: #00ff88;
    --warning: #ffaa00;
    --error: #ff4444;
    --glass: rgba(255, 255, 255, 0.1);
    --glass-dark: rgba(0, 0, 0, 0.3);
    --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    --radius: 12px;
    --transition: all 0.3s ease;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--darker);
    color: var(--light);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Background Effects */
  .bg-effects {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, var(--primary), transparent);
    animation: float 15s infinite linear;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
  }

  /* Header */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10, 14, 23, 0.9);
    backdrop-filter: blur(20px);
    z-index: 1000;
    border-bottom: 1px solid rgba(0, 198, 255, 0.2);
    box-shadow: var(--shadow);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .logo i {
    font-size: 24px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .control-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid rgba(0, 198, 255, 0.2);
    color: var(--light);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }

  .control-btn:hover {
    background: var(--gradient);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4);
  }

  /* Search */
  .search-container {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    z-index: 1000;
    transition: var(--transition);
  }

  .search-container.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(-20px);
    pointer-events: none;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: 15px 20px;
    border: 2px solid rgba(0, 198, 255, 0.3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--light);
    font-size: 16px;
    outline: none;
  }

  .search-box input::placeholder {
    color: var(--gray);
  }

  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(10, 14, 23, 0.98);
    border-radius: 0 0 var(--radius) var(--radius);
    margin-top: -2px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    border: 2px solid rgba(0, 198, 255, 0.3);
    border-top: none;
  }

  .search-results.active {
    display: block;
  }

  .search-item {
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: var(--transition);
  }

  .search-item:hover {
    background: rgba(0, 198, 255, 0.1);
  }

  .search-item.active {
    background: var(--gradient);
  }

  /* Player Container */
  .player-container {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  video.loaded {
    opacity: 1;
  }

  /* Video Overlay */
  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, transparent 70%, rgba(0, 0, 0, 0.8));
    pointer-events: none;
    z-index: 2;
  }

  /* Channel Info */
  .channel-info {
    position: absolute;
    bottom: 100px;
    left: 30px;
    z-index: 3;
    pointer-events: none;
  }

  .channel-name {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .channel-category {
    font-size: 16px;
    color: var(--gray);
    margin-bottom: 15px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--error);
    color: white;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* Loading */
  .loading-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.5s ease;
  }

  .loading-spinner {
    width: 60px;
    height: 60px;
    border: 4px solid transparent;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 18px;
    color: var(--gray);
  }

  /* Player Controls */
  .player-controls {
    position: absolute;
    bottom: 30px;
    left: 30px;
    right: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    padding: 15px 20px;
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 4;
  }

  .player-container:hover .player-controls {
    opacity: 1;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .control-btn-large {
    background: transparent;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    padding: 10px;
    border-radius: 50%;
    transition: var(--transition);
  }

  .control-btn-large:hover {
    background: var(--glass);
  }

  .volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .volume-slider {
    width: 80px;
    height: 4px;
    -webkit-appearance: none;
    background: var(--gray);
    border-radius: 2px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
  }

  /* Quality Selector */
  .quality-selector {
    position: relative;
  }

  .quality-btn {
    background: var(--glass);
    border: 1px solid rgba(0, 198, 255, 0.3);
    color: white;
    padding: 8px 15px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .quality-dropdown {
    position: absolute;
    bottom: 100%;
    right: 0;
    background: rgba(10, 14, 23, 0.95);
    border-radius: var(--radius);
    padding: 10px;
    min-width: 120px;
    display: none;
    box-shadow: var(--shadow);
  }

  .quality-dropdown.active {
    display: block;
  }

  .quality-option {
    padding: 10px;
    cursor: pointer;
    border-radius: 6px;
    transition: var(--transition);
  }

  .quality-option:hover {
    background: rgba(0, 198, 255, 0.1);
  }

  .quality-option.active {
    background: var(--gradient);
  }

  /* Channel List */
  .channel-list-container {
    position: fixed;
    right: -400px;
    top: 0;
    width: 350px;
    height: 100vh;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    padding: 80px 20px 20px;
    overflow-y: auto;
    transition: right 0.3s ease;
    z-index: 900;
    border-left: 1px solid rgba(0, 198, 255, 0.2);
  }

  .channel-list-container.active {
    right: 0;
  }

  .channel-list-title {
    font-size: 20px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary);
  }

  .channel-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: var(--glass-dark);
    border-radius: var(--radius);
    margin-bottom: 10px;
    cursor: pointer;
    transition: var(--transition);
  }

  .channel-item:hover {
    background: rgba(0, 198, 255, 0.1);
    transform: translateX(-5px);
  }

  .channel-item.active {
    background: var(--gradient);
  }

  .channel-icon {
    width: 40px;
    height: 40px;
    background: var(--gradient);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .channel-item-info h4 {
    font-size: 16px;
    margin-bottom: 4px;
  }

  .channel-item-info p {
    font-size: 12px;
    color: var(--gray);
  }

  /* Progress Bar */
  .progress-container {
    position: absolute;
    bottom: 85px;
    left: 30px;
    right: 30px;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    overflow: hidden;
    z-index: 3;
  }

  .progress-bar {
    height: 100%;
    background: var(--gradient);
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Notification */
  .notification {
    position: fixed;
    top: 100px;
    right: 30px;
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(20px);
    padding: 15px 20px;
    border-radius: var(--radius);
    border-left: 4px solid var(--primary);
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 1001;
    transform: translateX(150%);
    transition: transform 0.3s ease;
    max-width: 350px;
  }

  .notification.show {
    transform: translateX(0);
  }

  .notification i {
    font-size: 20px;
  }

  .notification.success {
    border-left-color: var(--success);
  }

  .notification.error {
    border-left-color: var(--error);
  }

  /* Settings Modal */
  .settings-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .settings-modal.active {
    opacity: 1;
    pointer-events: all;
  }

  .settings-content {
    background: rgba(10, 14, 23, 0.95);
    backdrop-filter: blur(30px);
    border-radius: var(--radius);
    padding: 30px;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .settings-title {
    font-size: 24px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .setting-group {
    margin-bottom: 25px;
  }

  .setting-label {
    display: block;
    margin-bottom: 10px;
    color: var(--gray);
  }

  .setting-select {
    width: 100%;
    padding: 12px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(0, 198, 255, 0.3);
    border-radius: var(--radius);
    color: white;
    font-size: 16px;
    outline: none;
  }

  /* Scroll Container */
  .scroll-container {
    height: 100vh;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overflow-y: scroll;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .scroll-container::-webkit-scrollbar {
    display: none;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .channel-info {
      bottom: 140px;
      left: 20px;
    }

    .channel-name {
      font-size: 22px;
    }

    .player-controls {
      bottom: 20px;
      left: 20px;
      right: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progress-container {
      bottom: 75px;
      left: 20px;
      right: 20px;
    }

    .channel-list-container {
      width: 100%;
      right: -100%;
    }

    .notification {
      left: 20px;
      right: 20px;
      max-width: none;
    }
  }

  /* Fullscreen styles */
  :fullscreen .header,
  :fullscreen .search-container,
  :fullscreen .channel-list-container,
  :fullscreen .notification {
    display: none;
  }
</style>
</head>
<body>

<!-- Background Effects -->
<div class="bg-effects" id="bgEffects"></div>

<!-- Header -->
<header class="header">
  <div class="logo">
    <i class="fas fa-satellite"></i>
    <span>LiveStream</span>
  </div>
  
  <div class="header-controls">
    <button class="control-btn" id="btnSearch" title="Search">
      <i class="fas fa-search"></i>
    </button>
    <button class="control-btn" id="btnChannels" title="Channel List">
      <i class="fas fa-list"></i>
    </button>
    <button class="control-btn" id="btnSettings" title="Settings">
      <i class="fas fa-cog"></i>
    </button>
    <button class="control-btn" id="btnFullscreen" title="Fullscreen">
      <i class="fas fa-expand"></i>
    </button>
  </div>
</header>

<!-- Search -->
<div class="search-container hidden" id="searchContainer">
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search channels...">
    <button class="control-btn" id="btnCloseSearch">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- Channel List Sidebar -->
<div class="channel-list-container" id="channelList">
  <h3 class="channel-list-title">Channels</h3>
  <div id="channelItems"></div>
</div>

<!-- Settings Modal -->
<div class="settings-modal" id="settingsModal">
  <div class="settings-content">
    <div class="settings-title">
      <span>Settings</span>
      <button class="control-btn" id="btnCloseSettings">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Video Quality</label>
      <select class="setting-select" id="qualitySelect">
        <option value="auto">Auto (Recommended)</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Buffer Size</label>
      <select class="setting-select" id="bufferSelect">
        <option value="10">Low (10s)</option>
        <option value="20" selected>Medium (20s)</option>
        <option value="30">High (30s)</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Autoplay Next Channel</label>
      <select class="setting-select" id="autoplaySelect">
        <option value="yes" selected>Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Default Volume</label>
      <input type="range" min="0" max="100" value="80" class="volume-slider" id="defaultVolume">
    </div>
    
    <button class="quality-btn" id="btnSaveSettings" style="width: 100%; margin-top: 20px;">
      Save Settings
    </button>
  </div>
</div>

<!-- Notification -->
<div class="notification" id="notification">
  <i class="fas fa-info-circle"></i>
  <span id="notificationText">Notification message</span>
</div>

<!-- Main Container -->
<div class="scroll-container" id="scrollContainer">
  <div id="playerSections"></div>
</div>

<script>
// Global variables
let channels = [];
let currentChannelIndex = 0;
let hlsInstances = new Map();
let playerSettings = {
  quality: 'auto',
  buffer: 20,
  autoplay: true,
  volume: 80,
  hardwareAcceleration: true
};
let isScrolling = false;

// Initialize background particles
function initParticles() {
  const container = document.getElementById('bgEffects');
  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.width = `${Math.random() * 5 + 2}px`;
    particle.style.height = particle.style.width;
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.animationDelay = `${Math.random() * 15}s`;
    particle.style.opacity = Math.random() * 0.3 + 0.1;
    container.appendChild(particle);
  }
}

// Show notification
function showNotification(message, type = 'info', duration = 3000) {
  const notification = document.getElementById('notification');
  const text = document.getElementById('notificationText');
  const icon = notification.querySelector('i');
  
  notification.className = 'notification';
  notification.classList.add(type);
  notification.classList.add('show');
  
  text.textContent = message;
  
  // Set icon based on type
  switch(type) {
    case 'success':
      icon.className = 'fas fa-check-circle';
      break;
    case 'error':
      icon.className = 'fas fa-exclamation-circle';
      break;
    default:
      icon.className = 'fas fa-info-circle';
  }
  
  setTimeout(() => {
    notification.classList.remove('show');
  }, duration);
}

// Universal video player with fallback
function createVideoPlayer(videoElement, url) {
  // Destroy existing HLS instance
  if (hlsInstances.has(videoElement)) {
    const oldHls = hlsInstances.get(videoElement);
    oldHls.destroy();
    hlsInstances.delete(videoElement);
  }
  
  // Try HLS.js first
  if (Hls.isSupported() && url.includes('.m3u8')) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90,
      maxBufferLength: playerSettings.buffer,
      maxMaxBufferLength: 60,
      maxBufferSize: 60 * 1000 * 1000,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,
      fragLoadingTimeOut: 10000,
      manifestLoadingTimeOut: 10000,
      levelLoadingTimeOut: 10000,
      abrMaxWithRealBitrate: true,
      startLevel: -1,
      capLevelToPlayerSize: true
    });
    
    hls.loadSource(url);
    hls.attachMedia(videoElement);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      videoElement.classList.add('loaded');
      showNotification('Stream loaded successfully', 'success', 2000);
    });
    
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            showNotification('Network error - trying fallback...', 'error');
            hls.destroy();
            videoElement.src = url;
            videoElement.load();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            hls.destroy();
            videoElement.src = url;
            videoElement.load();
        }
      }
    });
    
    hlsInstances.set(videoElement, hls);
    return hls;
  } 
  // Native HLS support (Safari)
  else if (videoElement.canPlayType('application/vnd.apple.mpegurl') && url.includes('.m3u8')) {
    videoElement.src = url;
    videoElement.addEventListener('loadedmetadata', () => {
      videoElement.classList.add('loaded');
      showNotification('Stream loaded successfully', 'success', 2000);
    });
    return null;
  }
  // Fallback for other formats
  else {
    videoElement.src = url;
    videoElement.load();
    videoElement.addEventListener('canplay', () => {
      videoElement.classList.add('loaded');
      showNotification('Stream loaded successfully', 'success', 2000);
    });
    return null;
  }
}

// Load channels from JSON
async function loadChannels() {
  try {
    const response = await fetch('channels.json');
    channels = await response.json();
    renderChannels();
    showNotification(`Loaded ${channels.length} channels`, 'success');
    return channels;
  } catch (error) {
    showNotification('Failed to load channels.json', 'error');
    console.error('Error loading channels:', error);
    
    // Fallback to default channels if JSON fails
    channels = [
      {
        id: 1,
        name: "Demo Channel 1",
        category: "Entertainment",
        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        logo: "📺",
        description: "Sample stream for testing"
      },
      {
        id: 2,
        name: "Demo Channel 2",
        category: "News",
        url: "https://mnmedias.api.telequebec.tv/m3u8/29880.m3u8",
        logo: "📡",
        description: "Another test stream"
      }
    ];
    renderChannels();
    return channels;
  }
}

// Render all channels
function renderChannels() {
  const container = document.getElementById('playerSections');
  const channelList = document.getElementById('channelItems');
  
  container.innerHTML = '';
  channelList.innerHTML = '';
  
  channels.forEach((channel, index) => {
    // Create player section
    const section = document.createElement('div');
    section.className = 'player-container';
    section.dataset.channelId = channel.id;
    section.id = `channel-${channel.id}`;
    
    section.innerHTML = `
      <div class="video-wrapper">
        <video 
          id="video-${channel.id}"
          playsinline 
          webkit-playsinline 
          preload="metadata"
          poster="${channel.poster || ''}"
          muted
        ></video>
        
        <div class="video-overlay"></div>
        
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading ${channel.name}...</div>
        </div>
        
        <div class="channel-info">
          <div class="channel-name">${channel.name}</div>
          <div class="channel-category">${channel.category || 'Live Stream'}</div>
          <div class="live-badge">
            <i class="fas fa-circle"></i>
            LIVE
          </div>
        </div>
        
        <div class="progress-container">
          <div class="progress-bar" id="progress-${channel.id}"></div>
        </div>
        
        <div class="player-controls">
          <div class="control-group">
            <button class="control-btn-large" onclick="togglePlayPause(${channel.id})">
              <i class="fas fa-play"></i>
            </button>
            <button class="control-btn-large" onclick="muteUnmute(${channel.id})">
              <i class="fas fa-volume-up"></i>
            </button>
            <div class="volume-container">
              <input type="range" min="0" max="100" value="80" 
                     class="volume-slider" 
                     oninput="setVolume(${channel.id}, this.value)">
            </div>
          </div>
          
          <div class="control-group">
            <div class="quality-selector">
              <button class="quality-btn" onclick="toggleQualityDropdown(${channel.id})">
                <i class="fas fa-cog"></i>
                Quality
              </button>
              <div class="quality-dropdown" id="quality-${channel.id}">
                <div class="quality-option" onclick="setQuality(${channel.id}, 'auto')">Auto</div>
                <div class="quality-option" onclick="setQuality(${channel.id}, '1080')">1080p</div>
                <div class="quality-option" onclick="setQuality(${channel.id}, '720')">720p</div>
                <div class="quality-option" onclick="setQuality(${channel.id}, '480')">480p</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(section);
    
    // Create channel list item
    const listItem = document.createElement('div');
    listItem.className = 'channel-item';
    if (index === 0) listItem.classList.add('active');
    listItem.onclick = () => switchToChannel(index);
    
    listItem.innerHTML = `
      <div class="channel-icon">
        ${channel.logo || '📺'}
      </div>
      <div class="channel-item-info">
        <h4>${channel.name}</h4>
        <p>${channel.category || 'Live Stream'}</p>
      </div>
    `;
    
    channelList.appendChild(listItem);
    
    // Initialize video player
    setTimeout(() => {
      const video = document.getElementById(`video-${channel.id}`);
      if (video && channel.url) {
        createVideoPlayer(video, channel.url);
      }
    }, 100);
  });
  
  // Setup scroll snapping
  setupScrollSnap();
}

// Setup scroll snapping
function setupScrollSnap() {
  const container = document.getElementById('scrollContainer');
  const sections = document.querySelectorAll('.player-container');
  
  container.addEventListener('scroll', () => {
    if (isScrolling) return;
    
    sections.forEach((section, index) => {
      const rect = section.getBoundingClientRect();
      if (rect.top >= 0 && rect.top < window.innerHeight / 2) {
        switchToChannel(index);
      }
    });
  });
}

// Switch to channel
function switchToChannel(index) {
  if (index < 0 || index >= channels.length) return;
  
  currentChannelIndex = index;
  
  // Update active channel in list
  document.querySelectorAll('.channel-item').forEach((item, i) => {
    item.classList.toggle('active', i === index);
  });
  
  // Scroll to channel
  const section = document.getElementById(`channel-${channels[index].id}`);
  if (section) {
    isScrolling = true;
    section.scrollIntoView({ behavior: 'smooth' });
    
    setTimeout(() => {
      isScrolling = false;
    }, 500);
  }
  
  // Play video if autoplay is enabled
  if (playerSettings.autoplay) {
    setTimeout(() => {
      const video = document.getElementById(`video-${channels[index].id}`);
      if (video) {
        video.play().catch(e => console.log('Autoplay prevented:', e));
      }
    }, 300);
  }
  
  showNotification(`Switched to ${channels[index].name}`);
}

// Toggle play/pause
function togglePlayPause(channelId) {
  const video = document.getElementById(`video-${channelId}`);
  const button = video.closest('.player-controls').querySelector('.fa-play, .fa-pause');
  
  if (video.paused) {
    video.play();
    button.className = 'fas fa-pause';
  } else {
    video.pause();
    button.className = 'fas fa-play';
  }
}

// Mute/unmute
function muteUnmute(channelId) {
  const video = document.getElementById(`video-${channelId}`);
  const button = video.closest('.player-controls').querySelector('.fa-volume-up, .fa-volume-mute');
  
  video.muted = !video.muted;
  button.className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
}

// Set volume
function setVolume(channelId, value) {
  const video = document.getElementById(`video-${channelId}`);
  video.volume = value / 100;
}

// Toggle quality dropdown
function toggleQualityDropdown(channelId) {
  const dropdown = document.getElementById(`quality-${channelId}`);
  dropdown.classList.toggle('active');
}

// Set quality
function setQuality(channelId, quality) {
  const video = document.getElementById(`video-${channelId}`);
  const hls = hlsInstances.get(video);
  
  if (hls) {
    if (quality === 'auto') {
      hls.currentLevel = -1;
    } else {
      const levels = hls.levels;
      const targetLevel = levels.findIndex(level => 
        level.height <= parseInt(quality)
      );
      if (targetLevel !== -1) {
        hls.currentLevel = targetLevel;
      }
    }
  }
  
  showNotification(`Quality set to ${quality}`);
  toggleQualityDropdown(channelId);
}

// Search functionality
function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const searchContainer = document.getElementById('searchContainer');
  const btnSearch = document.getElementById('btnSearch');
  const btnCloseSearch = document.getElementById('btnCloseSearch');
  
  btnSearch.addEventListener('click', () => {
    searchContainer.classList.toggle('hidden');
    if (!searchContainer.classList.contains('hidden')) {
      searchInput.focus();
    }
  });
  
  btnCloseSearch.addEventListener('click', () => {
    searchContainer.classList.add('hidden');
    searchResults.classList.remove('active');
  });
  
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    
    if (query.length === 0) {
      searchResults.classList.remove('active');
      return;
    }
    
    const filtered = channels.filter(channel =>
      channel.name.toLowerCase().includes(query) ||
      (channel.category && channel.category.toLowerCase().includes(query)) ||
      (channel.description && channel.description.toLowerCase().includes(query))
    );
    
    if (filtered.length > 0) {
      filtered.forEach(channel => {
        const index = channels.findIndex(c => c.id === channel.id);
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `
          <strong>${channel.name}</strong>
          <small>${channel.category || 'Live Stream'}</small>
        `;
        item.onclick = () => {
          switchToChannel(index);
          searchContainer.classList.add('hidden');
          searchResults.classList.remove('active');
          searchInput.value = '';
        };
        searchResults.appendChild(item);
      });
      searchResults.classList.add('active');
    } else {
      const item = document.createElement('div');
      item.className = 'search-item';
      item.innerHTML = '<em>No channels found</em>';
      searchResults.appendChild(item);
      searchResults.classList.add('active');
    }
  });
  
  // Close search when clicking outside
  document.addEventListener('click', (e) => {
    if (!searchContainer.contains(e.target) && !btnSearch.contains(e.target)) {
      searchContainer.classList.add('hidden');
      searchResults.classList.remove('active');
    }
  });
}

// Settings functionality
function setupSettings() {
  const settingsModal = document.getElementById('settingsModal');
  const btnSettings = document.getElementById('btnSettings');
  const btnCloseSettings = document.getElementById('btnCloseSettings');
  const btnSaveSettings = document.getElementById('btnSaveSettings');
  
  // Load saved settings
  const savedSettings = localStorage.getItem('liveTvSettings');
  if (savedSettings) {
    Object.assign(playerSettings, JSON.parse(savedSettings));
  }
  
  // Apply loaded settings to UI
  document.getElementById('qualitySelect').value = playerSettings.quality;
  document.getElementById('bufferSelect').value = playerSettings.buffer;
  document.getElementById('autoplaySelect').value = playerSettings.autoplay ? 'yes' : 'no';
  document.getElementById('defaultVolume').value = playerSettings.volume;
  
  btnSettings.addEventListener('click', () => {
    settingsModal.classList.add('active');
  });
  
  btnCloseSettings.addEventListener('click', () => {
    settingsModal.classList.remove('active');
  });
  
  btnSaveSettings.addEventListener('click', () => {
    playerSettings.quality = document.getElementById('qualitySelect').value;
    playerSettings.buffer = parseInt(document.getElementById('bufferSelect').value);
    playerSettings.autoplay = document.getElementById('autoplaySelect').value === 'yes';
    playerSettings.volume = parseInt(document.getElementById('defaultVolume').value);
    
    localStorage.setItem('liveTvSettings', JSON.stringify(playerSettings));
    
    // Apply volume to all videos
    document.querySelectorAll('video').forEach(video => {
      video.volume = playerSettings.volume / 100;
    });
    
    settingsModal.classList.remove('active');
    showNotification('Settings saved successfully', 'success');
  });
  
  // Close modal when clicking outside
  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) {
      settingsModal.classList.remove('active');
    }
  });
}

// Fullscreen functionality
function setupFullscreen() {
  const btnFullscreen = document.getElementById('btnFullscreen');
  
  btnFullscreen.addEventListener('click', () => {
    const container = document.getElementById('scrollContainer');
    
    if (!document.fullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
      }
      btnFullscreen.innerHTML = '<i class="fas fa-compress"></i>';
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
      btnFullscreen.innerHTML = '<i class="fas fa-expand"></i>';
    }
  });
  
  document.addEventListener('fullscreenchange', updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
  document.addEventListener('msfullscreenchange', updateFullscreenButton);
  
  function updateFullscreenButton() {
    btnFullscreen.innerHTML = document.fullscreenElement ? 
      '<i class="fas fa-compress"></i>' : 
      '<i class="fas fa-expand"></i>';
  }
}

// Channel list sidebar
function setupChannelList() {
  const btnChannels = document.getElementById('btnChannels');
  const channelList = document.getElementById('channelList');
  
  btnChannels.addEventListener('click', () => {
    channelList.classList.toggle('active');
  });
  
  // Close when clicking outside on mobile
  if (window.innerWidth <= 768) {
    document.addEventListener('click', (e) => {
      if (!channelList.contains(e.target) && !btnChannels.contains(e.target)) {
        channelList.classList.remove('active');
      }
    });
  }
}

// Initialize everything
document.addEventListener('DOMContentLoaded', () => {
  initParticles();
  loadChannels();
  setupSearch();
  setupSettings();
  setupFullscreen();
  setupChannelList();
  
  // Load any popup message
  fetch('message.json')
    .then(res => res.json())
    .then(msg => {
      if (msg.enabled) {
        setTimeout(() => {
          showNotification(msg.message, msg.type || 'info', 5000);
        }, 2000);
      }
    })
    .catch(() => {});
  
  // Handle beforeunload to clean up HLS instances
  window.addEventListener('beforeunload', () => {
    hlsInstances.forEach(hls => hls.destroy());
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Spacebar to play/pause current video
  if (e.code === 'Space' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    const currentVideo = document.getElementById(`video-${channels[currentChannelIndex].id}`);
    if (currentVideo) {
      togglePlayPause(channels[currentChannelIndex].id);
    }
  }
  
  // Arrow keys for navigation
  if (e.code === 'ArrowDown') {
    e.preventDefault();
    switchToChannel(Math.min(currentChannelIndex + 1, channels.length - 1));
  }
  
  if (e.code === 'ArrowUp') {
    e.preventDefault();
    switchToChannel(Math.max(currentChannelIndex - 1, 0));
  }
  
  // F for fullscreen
  if (e.code === 'KeyF' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    document.getElementById('btnFullscreen').click();
  }
  
  // M for mute
  if (e.code === 'KeyM' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    const currentVideo = document.getElementById(`video-${channels[currentChannelIndex].id}`);
    if (currentVideo) {
      muteUnmute(channels[currentChannelIndex].id);
    }
  }
  
  // Escape to close modals
  if (e.code === 'Escape') {
    document.getElementById('searchContainer').classList.add('hidden');
    document.getElementById('settingsModal').classList.remove('active');
    document.getElementById('channelList').classList.remove('active');
  }
});
</script>
