<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Feed</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial,sans-serif;
  }

  /* Feed */
  .container{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .channel{
    height:100vh;
    width:100vw;
    position:relative;
    scroll-snap-align:start;
    scroll-snap-stop:always;
  }
  video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
  }

  /* Loading spinner */
  .loading{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.7);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-direction:column;
    gap:16px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .loading.show{opacity:1;}
  .spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid #0ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

  /* Overlay */
  .overlay{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
  }
  .live{
    background:red;
    padding:4px 10px;
    border-radius:5px;
    font-size:12px;
  }
  .name{font-size:22px;margin-top:8px;}
  .desc{opacity:.85}

  /* Search bar */
  .search-bar{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    max-width:420px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:10px 18px;
    z-index:2000;
    display:flex;
    align-items:center;
    gap:10px;
    opacity:1;
    transition:opacity .4s ease;
  }
  .search-bar.hidden{
    opacity:0;
    pointer-events:none;
  }
  .search-bar input{
    background:none;
    border:none;
    outline:none;
    color:white;
    width:100%;
    font-size:16px;
  }

  /* Floating search icon */
  .search-float{
    position:fixed;
    top:14px;
    right:14px;
    font-size:22px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    padding:10px 12px;
    border-radius:50%;
    z-index:2000;
    display:none;
    cursor:pointer;
  }
  .search-float.show{display:block;}

  /* Popup */
  #popup {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
  }
  #popup > div {
    background:#0b0b0b;
    color:white;
    padding:22px;
    border-radius:18px;
    max-width:320px;
    width:85%;
    text-align:center;
    box-shadow:0 0 35px rgba(0,255,255,.25);
    animation:pop .35s ease;
  }
  .popup-warning { background:#ffcc00; box-shadow:0 0 35px rgba(255,215,0,.5); color:#000; }
  .popup-error   { background:#ff4444; box-shadow:0 0 35px rgba(255,0,0,.5); }

  @keyframes pop{
    from{transform:scale(.8);opacity:0}
    to{transform:scale(1);opacity:1}
  }
</style>
</head>
<body>

<!-- Popup Message -->
<div id="popup">
  <div>
    <h2 id="pTitle" style="margin-top:0;"></h2>
    <p id="pText" style="opacity:.9;"></p>
    <button id="pBtn" style="margin-top:14px;padding:10px 24px;background:#0ff;color:#000;border:none;border-radius:14px;font-weight:bold;cursor:pointer;">Close</button>
  </div>
</div>

<!-- Search bar -->
<div class="search-bar" id="searchBar">
  🔍
  <input id="searchInput" placeholder="Search channels...">
</div>

<!-- Floating icon -->
<div class="search-float" id="searchFloat">🔎</div>

<div class="container" id="feed"></div>

<script>
const feed = document.getElementById('feed');
let channels = [];
let activeVideo = null;

// Optimized low-latency HLS config (best for 2025+ streams)
const hlsConfig = {
  lowLatencyMode: true,              // Enable LL-HLS features
  liveSyncDurationCount: 2,          // Stay close to live edge (~2 segments)
  liveMaxLatencyDurationCount: 5,     // Catch up if lag >5 segments
  maxLiveSyncPlaybackRate: 1.15,      // Gentle speedup to reduce drift
  maxBufferLength: 15,               // Limit total buffer (~15s)
  maxMaxBufferLength: 20,
  startLevel: -1,                    // Auto-start lowest bitrate → faster initial load
  abrEwmaDefaultEstimate: 500000,    // Conservative initial bandwidth → quick start
  enableWorker: false                 // Slightly lower latency on some devices
};

// IntersectionObserver for lazy loading + play/pause
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const section = entry.target;
    const video = section.querySelector('video');
    const loading = section.querySelector('.loading');

    if (entry.isIntersecting && entry.intersectionRatio >= 0.85) {
      // Show loading spinner
      loading.classList.add('show');

      // Lazy load HLS only when visible
      if (!section._hls && video.dataset.url) {
        if (Hls.isSupported()) {
          const hls = new Hls(hlsConfig);
          hls.loadSource(video.dataset.url);
          hls.attachMedia(video);
          section._hls = hls;

          // Hide spinner when enough data is buffered
          hls.on(Hls.Events.BUFFER_APPENDED, () => {
            if (video.buffered.length > 0 && video.buffered.end(0) - video.currentTime > 2) {
              loading.classList.remove('show');
            }
          });

          // Error handling
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              console.error('HLS fatal error:', data);
              loading.textContent = 'Stream error – retrying...';
            }
          });
        } else {
          video.src = video.dataset.url;
          video.load();
          loading.classList.remove('show');
        }
      }

      // Play current, pause others
      if (video !== activeVideo) {
        activeVideo = video;
        document.querySelectorAll('video').forEach(v => {
          if (v === video) {
            v.muted = false;
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        });
      }
    } else {
      // Clean up when leaving view
      if (section._hls) {
        section._hls.destroy();
        section._hls = null;
      }
      if (video === activeVideo) {
        video.pause();
      }
      loading.classList.remove('show');
    }
  });
}, { threshold: 0.85 });

// Render channels
function render(list) {
  feed.innerHTML = '';
  activeVideo = null;

  list.forEach(c => {
    const section = document.createElement('section');
    section.className = 'channel';
    section.innerHTML = `
      <video playsinline data-url="${c.url}" poster="${c.poster || ''}"></video>
      <div class="loading">
        <div class="spinner"></div>
        Loading live stream...
      </div>
      <div class="overlay">
        <span class="live">LIVE</span>
        <div class="name">${c.name}</div>
        <div class="desc">${c.desc}</div>
      </div>`;
    feed.appendChild(section);

    section._hls = null;
    observer.observe(section);
  });
}

// Search logic (also matches description)
const searchBar = document.getElementById('searchBar');
const searchFloat = document.getElementById('searchFloat');
const searchInput = document.getElementById('searchInput');

function hideSearch() {
  searchBar.classList.add('hidden');
  searchFloat.classList.add('show');
}
function showSearch() {
  searchBar.classList.remove('hidden');
  searchFloat.classList.remove('show');
  searchInput.focus();
  autoHide();
}
let hideTimer;
function autoHide() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideSearch, 12000);
}
searchFloat.onclick = showSearch;

searchInput.oninput = () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = channels.filter(c => 
    c.name.toLowerCase().includes(q) || 
    (c.desc && c.desc.toLowerCase().includes(q))
  );
  render(filtered);
};

// Load channels
fetch('channels.json')
  .then(res => res.json())
  .then(data => {
    channels = data;
    render(channels);
    autoHide();
  })
  .catch(err => console.error('Failed to load channels.json', err));

// Popup message
fetch('message.json')
  .then(res => res.json())
  .then(msg => {
    if (msg.enabled) {
      document.getElementById('pTitle').textContent = msg.title || '';
      document.getElementById('pText').textContent = msg.message || '';
      document.getElementById('pBtn').textContent = msg.button || 'Close';

      const popupContainer = document.querySelector('#popup > div');
      popupContainer.className = '';
      if (msg.type === 'warning') popupContainer.classList.add('popup-warning');
      else if (msg.type === 'error') popupContainer.classList.add('popup-error');

      document.getElementById('popup').style.display = 'flex';
    }
  })
  .catch(() => {});

document.getElementById('pBtn').onclick = () => {
  document.getElementById('popup').style.display = 'none';
};
</script>
</body>
  </html>
