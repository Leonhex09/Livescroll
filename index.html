<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Feed</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* Base styles */
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial,sans-serif;
  }

  .container{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    position: relative;
    z-index: 3;
  }
  
  .channel{
    height:100vh;
    width:100vw;
    position:relative;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    box-shadow: 0 0 20px rgba(100, 200, 255, 0.1) inset;
  }

  video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:transparent !important;
    opacity: 0;
    transition: opacity 1s ease;
  }
  video.playing {
    opacity: 1;
  }

  .loading{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
    z-index: 5;
  }
  .loading.show{
    opacity:1;
    pointer-events:all;
  }
  .loading-text {
    font-family: 'Georgia', serif;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .overlay{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 5px black;
    z-index: 4;
  }
  .live{
    background:rgba(255,0,0,0.8);
    padding:4px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
  }
  .name{
    font-size:22px;
    margin-top:8px;
    font-weight: bold;
  }
  .desc{opacity:.9; font-size:14px;}

  /* Search bar */
  .search-bar{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    max-width:400px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:10px 16px;
    z-index:2000;
    display:flex;
    align-items:center;
    gap:10px;
    opacity:1;
    transition:opacity .3s ease;
    border: 1px solid rgba(100, 255, 255, 0.2);
  }
  .search-bar.hidden{opacity:0; pointer-events:none;}
  .search-bar input{
    background:none;
    border:none;
    outline:none;
    color:white;
    width:100%;
    font-size:15px;
  }

  .search-float{
    position:fixed;
    top:14px;
    right:14px;
    font-size:20px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    padding:10px;
    border-radius:50%;
    z-index:2000;
    display:none;
    cursor:pointer;
    color:white;
    border: 1px solid rgba(100, 255, 255, 0.2);
  }
  .search-float.show{display:block;}

  /* Popup */
  #popup {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
  }
  #popup > div {
    background:#111;
    color:white;
    padding:24px;
    border-radius:12px;
    max-width:320px;
    width:85%;
    text-align:center;
    border: 1px solid rgba(100, 255, 255, 0.2);
  }
  .popup-warning { background:#333; color:#fff; }
  .popup-error   { background:#222; color:#ff4444; }

  /* Vertical Control Bar */
  .control-column {
    position: fixed;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
    background:rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    padding: 15px 10px;
    border-radius: 20px;
    border: 1px solid rgba(100, 255, 255, 0.2);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  
  .control-column.hidden {
    transform: translateY(-50%) translateX(calc(100% + 20px));
    opacity: 0;
    pointer-events: none;
  }
  
  .control-column-toggle {
    position: fixed;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(100, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0ff;
    font-size: 18px;
    cursor: pointer;
    z-index: 99;
  }
  
  .control-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  .control-btn:hover {
    background: rgba(255,255,255,0.2);
  }
  
  .control-btn.active {
    background: rgba(0,255,255,0.3);
  }
  
  /* Volume Control */
  .volume-container {
    position: relative;
  }
  
  .volume-slider {
    position: absolute;
    left: -120px;
    top: 50%;
    transform: translateY(-50%);
    width: 100px;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  
  .volume-container:hover .volume-slider {
    opacity: 1;
    pointer-events: all;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0ff;
    cursor: pointer;
  }
  
  .volume-slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0ff;
    cursor: pointer;
  }
  
  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100%;
    background: rgba(10, 20, 35, 0.95);
    z-index: 2001;
    padding: 70px 15px 20px;
    overflow-y: auto;
    transition: left 0.3s ease;
  }
  
  .sidebar.open {
    left: 0;
  }
  
  .sidebar-header {
    color: white;
    font-size: 20px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(100,255,255,0.3);
    text-align: center;
  }
  
  .channel-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .channel-item:hover {
    background: rgba(255,255,255,0.1);
  }
  
  .channel-item.active {
    background: rgba(0,255,255,0.2);
  }
  
  .channel-item .live-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: red;
    margin-right: 10px;
  }
  
  .channel-item .channel-name {
    flex: 1;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .favorite-btn {
    background: none;
    border: none;
    color: gold;
    font-size: 16px;
    cursor: pointer;
    padding: 5px;
  }
  
  /* Stream Info */
  .stream-info {
    position: fixed;
    top: 80px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    padding: 10px 15px;
    border-radius: 8px;
    color: #0ff;
    font-family: monospace;
    font-size: 12px;
    z-index: 99;
    opacity: 0;
    transition: opacity 0.3s;
    border: 1px solid rgba(0,255,255,0.2);
    max-width: 180px;
  }
  
  .stream-info.show {
    opacity: 1;
  }
  
  /* Sleep Timer */
  .sleep-timer {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,20,35,0.95);
    padding: 24px;
    border-radius: 12px;
    color: white;
    z-index: 2002;
    min-width: 260px;
    border: 1px solid rgba(0,255,255,0.2);
    display: none;
  }
  
  .sleep-timer.show {
    display: block;
  }
  
  .timer-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
    justify-content: center;
  }
  
  .timer-btn {
    padding: 8px 12px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }
  
  .timer-btn:hover {
    background: rgba(0,255,255,0.2);
  }
  
  /* Mobile responsiveness */
  @media (max-width: 768px) {
    .control-column {
      right: 10px;
      padding: 12px 8px;
      gap: 8px;
    }
    
    .control-btn {
      width: 42px;
      height: 42px;
      font-size: 16px;
    }
    
    .control-column-toggle {
      right: 10px;
      width: 42px;
      height: 42px;
      font-size: 16px;
    }
    
    .volume-slider {
      left: -110px;
      width: 90px;
    }
    
    .sidebar {
      width: 85%;
      left: -100%;
    }
    
    .search-bar {
      width: 85%;
    }
    
    .stream-info {
      top: 70px;
      right: 10px;
      font-size: 11px;
      padding: 8px 12px;
      max-width: 160px;
    }
    
    .overlay {
      bottom: 15px;
      left: 15px;
    }
    
    .name {
      font-size: 20px;
    }
  }
  
  @media (max-width: 480px) {
    .control-column {
      right: 8px;
      padding: 10px 6px;
      gap: 6px;
    }
    
    .control-btn {
      width: 40px;
      height: 40px;
      font-size: 15px;
    }
    
    .control-column-toggle {
      right: 8px;
      width: 40px;
      height: 40px;
      font-size: 15px;
    }
    
    .volume-slider {
      left: -100px;
      width: 80px;
    }
    
    .overlay {
      bottom: 10px;
      left: 10px;
    }
    
    .name {
      font-size: 18px;
    }
    
    .live {
      font-size: 11px;
      padding: 3px 10px;
    }
    
    .desc {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<!-- Popup -->
<div id="popup">
  <div>
    <h2 id="pTitle" style="margin-top:0;"></h2>
    <p id="pText" style="opacity:.9;"></p>
    <button id="pBtn" style="margin-top:14px;padding:10px 24px;background:#0ff;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Close</button>
  </div>
</div>

<!-- Search bar -->
<div class="search-bar" id="searchBar">
  🔍
  <input id="searchInput" placeholder="Search channels...">
</div>

<div class="search-float" id="searchFloat">🔎</div>

<!-- Control Column Toggle Button -->
<div class="control-column-toggle" id="controlToggle">
  <i class="fas fa-chevron-left"></i>
</div>

<!-- Vertical Control Column -->
<div class="control-column" id="controlColumn">
  <div class="volume-container">
    <button class="control-btn" id="volumeBtn" title="Volume">
      <i class="fas fa-volume-up"></i>
    </button>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
  </div>
  
  <button class="control-btn" id="fullscreenBtn" title="Fullscreen">
    <i class="fas fa-expand"></i>
  </button>
  
  <button class="control-btn" id="infoBtn" title="Stream Info">
    <i class="fas fa-info-circle"></i>
  </button>
  
  <button class="control-btn" id="sleepBtn" title="Sleep Timer">
    <i class="fas fa-moon"></i>
  </button>
  
  <button class="control-btn" id="shareBtn" title="Share Channel">
    <i class="fas fa-share-alt"></i>
  </button>
  
  <button class="control-btn" id="favoriteBtn" title="Add to Favorites">
    <i class="far fa-star"></i>
  </button>
  
  <button class="control-btn" id="sidebarBtn" title="Channel List">
    <i class="fas fa-bars"></i>
  </button>
</div>

<!-- Stream Info -->
<div class="stream-info" id="streamInfo">
  <div>Bitrate: <span id="bitrate">--</span></div>
  <div>Resolution: <span id="resolution">--</span></div>
  <div>Buffer: <span id="buffer">--</span></div>
</div>

<!-- Sleep Timer Panel -->
<div class="sleep-timer" id="sleepTimer">
  <h3 style="margin-top:0;text-align:center;">Sleep Timer</h3>
  <div class="timer-options">
    <button class="timer-btn" data-minutes="5">5 min</button>
    <button class="timer-btn" data-minutes="15">15 min</button>
    <button class="timer-btn" data-minutes="30">30 min</button>
    <button class="timer-btn" data-minutes="60">60 min</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:15px;">
    <input type="number" id="customTimer" placeholder="Custom minutes" style="flex:1;padding:8px;border-radius:6px;border:none;background:rgba(255,255,255,0.1);color:white;">
    <button class="timer-btn" id="setCustomTimer">Set</button>
  </div>
  <div style="text-align:center;margin-top:20px;">
    <button class="timer-btn" id="cancelTimer" style="background:rgba(255,50,50,0.7);">Cancel Timer</button>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <i class="fas fa-satellite-dish" style="margin-right:8px;"></i>
    Channels
  </div>
  <div id="channelList"></div>
</div>

<!-- Main Content -->
<div class="container" id="feed"></div>

<script>
// Global variables
const feed = document.getElementById('feed');
let channels = [];
let activeVideo = null;
let activeChannelIndex = 0;
let favorites = JSON.parse(localStorage.getItem('tvFavorites')) || [];
let sleepTimer = null;

// HLS config
const hlsConfig = {
  lowLatencyMode: true,
  liveSyncDurationCount: 2,
  liveMaxLatencyDurationCount: 4,
  maxBufferLength: 10,
  backBufferLength: 5,
  enableWorker: true
};

// Intersection Observer
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const section = entry.target;
    const video = section.querySelector('video');
    const loading = section.querySelector('.loading');
    let hls = section._hls;

    if (entry.intersectionRatio >= 0.3) {
      loading.classList.add('show');

      if (!hls && video.dataset.url) {
        if (Hls.isSupported()) {
          hls = new Hls(hlsConfig);
          hls.loadSource(video.dataset.url);
          hls.attachMedia(video);
          section._hls = hls;

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              console.error('HLS fatal error:', data);
              loading.innerHTML = '<div>Stream error<br>Try scrolling away and back</div>';
            }
          });

          // Stream info updates
          hls.on(Hls.Events.FRAG_LOADED, (event, data) => {
            updateStreamInfo(hls, video);
          });
        } else {
          video.src = video.dataset.url;
          video.load();
          video.play().catch(() => {});
        }
      } else if (hls) {
        hls.startLoad();
      }

      video.onplaying = () => {
        video.classList.add('playing');
        loading.classList.remove('show');
        updateActiveChannel(section);
      };
      video.onwaiting = () => loading.classList.add('show');
      video.onpause = () => video.classList.remove('playing');
      video.onerror = () => {
        loading.innerHTML = '<div>Failed to load stream</div>';
      };

      if (entry.intersectionRatio >= 0.85) {
        if (video !== activeVideo) {
          activeVideo = video;
          document.querySelectorAll('video').forEach(v => {
            if (v === video) {
              v.muted = false;
              v.volume = parseFloat(localStorage.getItem('tvVolume') || '1');
              v.play().then(() => {
                v.classList.add('playing');
                loading.classList.remove('show');
              }).catch(() => {});
            } else {
              v.pause();
              v.muted = true;
              v.classList.remove('playing');
            }
          });
        }
      }
    } else {
      if (hls) hls.stopLoad();
      video.pause();
      video.classList.remove('playing');
      if (video === activeVideo) {
        activeVideo = null;
      }
      loading.classList.remove('show');
    }
  });
}, { threshold: [0, 0.3, 0.85] });

// Update active channel info
function updateActiveChannel(section) {
  const channelIndex = Array.from(feed.children).indexOf(section);
  activeChannelIndex = channelIndex;
  
  // Update sidebar active state
  document.querySelectorAll('.channel-item').forEach((item, idx) => {
    item.classList.toggle('active', idx === channelIndex);
  });
  
  // Update favorite button
  const channel = channels[channelIndex];
  const favoriteBtn = document.getElementById('favoriteBtn');
  const isFavorite = favorites.some(fav => fav.url === channel.url);
  favoriteBtn.innerHTML = isFavorite ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
}

// Update stream info display
function updateStreamInfo(hls, video) {
  if (!hls || !document.getElementById('infoBtn').classList.contains('active')) return;
  
  const bitrate = hls.levels[hls.currentLevel]?.bitrate || 0;
  const resolution = hls.levels[hls.currentLevel]?.height || 0;
  const buffered = video.buffered.length > 0 ? video.buffered.end(0) - video.buffered.start(0) : 0;
  
  document.getElementById('bitrate').textContent = bitrate ? Math.round(bitrate / 1000) + ' kbps' : '--';
  document.getElementById('resolution').textContent = resolution ? resolution + 'p' : '--';
  document.getElementById('buffer').textContent = buffered.toFixed(1) + 's';
}

// Render channels
function render(list) {
  feed.innerHTML = '';
  activeVideo = null;

  list.forEach((c, idx) => {
    const section = document.createElement('section');
    section.className = 'channel';
    section.id = `channel-${idx}`;
    section.innerHTML = `
      <video playsinline data-url="${c.url}" poster="${c.poster || ''}"></video>
      <div class="loading">
        <div class="loading-text">Loading...</div>
      </div>
      <div class="overlay">
        <span class="live">LIVE</span>
        <div class="name">${c.name}</div>
        <div class="desc">${c.desc}</div>
      </div>`;
    feed.appendChild(section);

    section._hls = null;
    observer.observe(section);
  });

  // Update sidebar
  updateSidebar(list);
}

// Update sidebar channel list
function updateSidebar(list) {
  const channelList = document.getElementById('channelList');
  channelList.innerHTML = '';
  
  list.forEach((channel, idx) => {
    const isFavorite = favorites.some(fav => fav.url === channel.url);
    const item = document.createElement('div');
    item.className = `channel-item ${idx === activeChannelIndex ? 'active' : ''}`;
    item.innerHTML = `
      <div class="live-indicator"></div>
      <div class="channel-name">${channel.name}</div>
      <button class="favorite-btn" data-index="${idx}">
        <i class="${isFavorite ? 'fas' : 'far'} fa-star"></i>
      </button>
    `;
    
    item.addEventListener('click', () => {
      const sections = feed.querySelectorAll('.channel');
      if (sections[idx]) {
        sections[idx].scrollIntoView({ behavior: 'smooth' });
        toggleSidebar();
      }
    });
    
    channelList.appendChild(item);
  });
  
  // Add favorite button listeners
  document.querySelectorAll('.favorite-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.index);
      toggleFavorite(idx);
    });
  });
}

// Toggle favorite
function toggleFavorite(index) {
  const channel = channels[index];
  const favoriteIndex = favorites.findIndex(fav => fav.url === channel.url);
  
  if (favoriteIndex === -1) {
    favorites.push(channel);
  } else {
    favorites.splice(favoriteIndex, 1);
  }
  
  localStorage.setItem('tvFavorites', JSON.stringify(favorites));
  updateSidebar(channels);
  
  // Update main favorite button if this is the active channel
  if (index === activeChannelIndex) {
    const favoriteBtn = document.getElementById('favoriteBtn');
    favoriteBtn.innerHTML = favoriteIndex === -1 ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
  }
}

// Toggle sidebar
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('open');
}

// Toggle control column
function toggleControlColumn() {
  const controlColumn = document.getElementById('controlColumn');
  const controlToggle = document.getElementById('controlToggle');
  
  if (controlColumn.classList.contains('hidden')) {
    // Show controls
    controlColumn.classList.remove('hidden');
    controlToggle.classList.add('hidden');
  } else {
    // Hide controls
    controlColumn.classList.add('hidden');
    controlToggle.classList.remove('hidden');
  }
}

// Search functionality
const searchBar = document.getElementById('searchBar');
const searchFloat = document.getElementById('searchFloat');
const searchInput = document.getElementById('searchInput');

function hideSearch() {
  searchBar.classList.add('hidden');
  searchFloat.classList.add('show');
}
function showSearch() {
  searchBar.classList.remove('hidden');
  searchFloat.classList.remove('show');
  searchInput.focus();
}
searchFloat.onclick = showSearch;

searchInput.oninput = () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = channels.filter(c => 
    c.name.toLowerCase().includes(q) || 
    (c.desc && c.desc.toLowerCase().includes(q))
  );
  render(filtered);
};

// Initialize controls
function initControls() {
  // Control column toggle
  const controlToggle = document.getElementById('controlToggle');
  controlToggle.addEventListener('click', toggleControlColumn);
  
  // Volume control
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeBtn = document.getElementById('volumeBtn');
  
  volumeSlider.value = localStorage.getItem('tvVolume') || '1';
  
  volumeSlider.addEventListener('input', (e) => {
    const volume = parseFloat(e.target.value);
    if (activeVideo) activeVideo.volume = volume;
    localStorage.setItem('tvVolume', volume);
    
    // Update volume icon
    if (volume === 0) {
      volumeBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
    } else if (volume < 0.5) {
      volumeBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
    } else {
      volumeBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
    }
  });
  
  volumeBtn.addEventListener('click', () => {
    if (activeVideo) {
      if (activeVideo.volume > 0) {
        activeVideo.volume = 0;
        volumeSlider.value = '0';
        volumeBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
      } else {
        activeVideo.volume = 1;
        volumeSlider.value = '1';
        volumeBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
      }
      localStorage.setItem('tvVolume', activeVideo.volume);
    }
  });
  
  // Fullscreen
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(console.log);
      fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
    } else {
      document.exitFullscreen().catch(console.log);
      fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
    }
  });
  
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
    } else {
      fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
    }
  });
  
  // Stream info
  const infoBtn = document.getElementById('infoBtn');
  const streamInfo = document.getElementById('streamInfo');
  
  infoBtn.addEventListener('click', () => {
    infoBtn.classList.toggle('active');
    streamInfo.classList.toggle('show');
  });
  
  // Sleep timer
  const sleepBtn = document.getElementById('sleepBtn');
  const sleepTimerPanel = document.getElementById('sleepTimer');
  const cancelTimerBtn = document.getElementById('cancelTimer');
  
  sleepBtn.addEventListener('click', () => {
    sleepTimerPanel.classList.toggle('show');
  });
  
  document.querySelectorAll('.timer-btn[data-minutes]').forEach(btn => {
    btn.addEventListener('click', () => {
      const minutes = parseInt(btn.dataset.minutes);
      setSleepTimer(minutes);
      sleepTimerPanel.classList.remove('show');
    });
  });
  
  document.getElementById('setCustomTimer').addEventListener('click', () => {
    const minutes = parseInt(document.getElementById('customTimer').value);
    if (minutes > 0) {
      setSleepTimer(minutes);
      sleepTimerPanel.classList.remove('show');
    }
  });
  
  cancelTimerBtn.addEventListener('click', () => {
    clearTimeout(sleepTimer);
    sleepTimer = null;
    sleepTimerPanel.classList.remove('show');
    showNotification('Sleep timer cancelled');
  });
  
  // Share channel
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', () => {
    if (navigator.share && channels[activeChannelIndex]) {
      const channel = channels[activeChannelIndex];
      navigator.share({
        title: `Watch ${channel.name} Live`,
        text: channel.desc,
        url: window.location.href + '#channel-' + activeChannelIndex
      }).catch(console.log);
    } else {
      // Fallback copy to clipboard
      const channel = channels[activeChannelIndex];
      navigator.clipboard.writeText(`Check out ${channel.name}: ${window.location.href}#channel-${activeChannelIndex}`);
      showNotification('Link copied to clipboard!');
    }
  });
  
  // Favorite button
  const favoriteBtn = document.getElementById('favoriteBtn');
  favoriteBtn.addEventListener('click', () => {
    toggleFavorite(activeChannelIndex);
  });
  
  // Sidebar toggle
  const sidebarBtn = document.getElementById('sidebarBtn');
  sidebarBtn.addEventListener('click', toggleSidebar);
  
  // Close sidebar when clicking outside
  document.addEventListener('click', (e) => {
    const sidebar = document.getElementById('sidebar');
    if (sidebar.classList.contains('open') && 
        !sidebar.contains(e.target) && 
        !e.target.closest('#sidebarBtn')) {
      sidebar.classList.remove('open');
    }
  });
  
  // Close sleep timer when clicking outside
  document.addEventListener('click', (e) => {
    const sleepTimerPanel = document.getElementById('sleepTimer');
    if (sleepTimerPanel.classList.contains('show') && 
        !sleepTimerPanel.contains(e.target) && 
        !e.target.closest('#sleepBtn')) {
      sleepTimerPanel.classList.remove('show');
    }
  });
  
  // Handle escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    }
  });
}

// Set sleep timer
function setSleepTimer(minutes) {
  clearTimeout(sleepTimer);
  
  sleepTimer = setTimeout(() => {
    if (activeVideo) {
      activeVideo.pause();
      showNotification(`Sleep timer: Player paused after ${minutes} minutes`);
    }
  }, minutes * 60000);
  
  showNotification(`Sleep timer set for ${minutes} minutes`);
}

// Show notification
function showNotification(message) {
  const notification = document.createElement('div');
  notification.style.cssText = `
    position:fixed;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,20,40,0.9);
    color:#0ff;
    padding:12px 20px;
    border-radius:20px;
    z-index:9999;
    animation:fadeInOut 3s ease;
  `;
  
  document.head.insertAdjacentHTML('beforeend', `
    <style>
      @keyframes fadeInOut {
        0%,100% { opacity:0; transform:translateX(-50%) translateY(-20px); }
        20%,80% { opacity:1; transform:translateX(-50%) translateY(0); }
      }
    </style>
  `);
  
  notification.textContent = message;
  document.body.appendChild(notification);
  
  setTimeout(() => notification.remove(), 3000);
}

// Load channels
fetch('channels.json')
  .then(res => res.json())
  .then(data => {
    channels = data;
    render(channels);
    initControls();
  })
  .catch(err => console.error('Failed to load channels.json', err));

// Load message
fetch('message.json')
  .then(res => res.json())
  .then(msg => {
    if (msg.enabled) {
      document.getElementById('pTitle').textContent = msg.title || '';
      document.getElementById('pText').textContent = msg.message || '';
      document.getElementById('pBtn').textContent = msg.button || 'Close';

      const popupContainer = document.querySelector('#popup > div');
      popupContainer.className = '';
      if (msg.type === 'warning') popupContainer.classList.add('popup-warning');
      else if (msg.type === 'error') popupContainer.classList.add('popup-error');

      document.getElementById('popup').style.display = 'flex';
    }
  })
  .catch(() => {});

document.getElementById('pBtn').onclick = () => {
  document.getElementById('popup').style.display = 'none';
};

// Handle hash navigation
window.addEventListener('hashchange', () => {
  const hash = window.location.hash;
  if (hash.startsWith('#channel-')) {
    const index = parseInt(hash.replace('#channel-', ''));
    if (!isNaN(index) && channels[index]) {
      const sections = feed.querySelectorAll('.channel');
      if (sections[index]) {
        sections[index].scrollIntoView({ behavior: 'smooth' });
      }
    }
  }
});

// Initial hash check
if (window.location.hash) {
  setTimeout(() => {
    window.dispatchEvent(new Event('hashchange'));
  }, 500);
}
</script>
