
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Feed</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }

  /* Feed */
  .container{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .channel{
    height:100vh;
    width:100vw;
    position:relative;
    scroll-snap-align:start;
    scroll-snap-stop:always;
  }
  video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
  }

  /* Loading spinner */
  .loading{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.7);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-direction:column;
    gap:16px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .loading.show{opacity:1;}
  .spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid #0ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

  /* Overlay */
  .overlay{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
  }
  .live{
    background:red;
    padding:4px 10px;
    border-radius:5px;
    font-size:12px;
  }
  .name{font-size:22px;margin-top:8px;}
  .desc{opacity:.85}

  /* Search bar */
  .search-bar{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    max-width:420px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:10px 18px;
    z-index:2000;
    display:flex;
    align-items:center;
    gap:10px;
    opacity:1;
    transition:opacity .4s ease;
  }
  .search-bar.hidden{
    opacity:0;
    pointer-events:none;
  }
  .search-bar input{
    background:none;
    border:none;
    outline:none;
    color:white;
    width:100%;
    font-size:16px;
  }

  /* Floating search icon */
  .search-float{
    position:fixed;
    top:14px;
    right:14px;
    font-size:22px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    padding:10px 12px;
    border-radius:50%;
    z-index:2000;
    display:none;
    cursor:pointer;
  }
  .search-float.show{display:block;}

  /* === UPDATED: Sci-Fi HUD – Transparent, Smaller, No Background Plate === */
  .hud-corner{
    position:fixed;
    top:10px;
    left:10px;
    color:#0ff;
    font-size:12px; /* Smaller font */
    line-height:1.4;
    z-index:3000;
    pointer-events:none; /* Doesn't block touches */
    text-shadow:0 0 8px rgba(0,255,255,0.6);
    animation:glowPulse 4s infinite alternate;
  }
  @keyframes glowPulse{
    from{text-shadow:0 0 6px rgba(0,255,255,0.5);}
    to{text-shadow:0 0 12px rgba(0,255,255,0.8);}
  }
  .hud-title{
    font-size:9px;
    opacity:0.7;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .network-meter{
    margin:8px 0;
  }
  .bar-container{
    width:140px;
    height:8px;
    background:rgba(0,50,70,0.4);
    border:1px solid rgba(0,255,255,0.4);
    border-radius:4px;
    overflow:hidden;
    margin-top:3px;
  }
  .bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #003040, #00ffff);
    transition:width 0.8s ease;
    box-shadow:0 0 6px #0ff;
  }
  .speed-text{
    margin-top:3px;
    font-size:13px;
    letter-spacing:0.5px;
  }
  .weather{
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed rgba(0,255,255,0.3);
  }
  .weather-temp{
    font-size:16px;
  }

  /* Popup */
  #popup {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
  }
  #popup > div {
    background:#0b0b0b;
    color:white;
    padding:22px;
    border-radius:18px;
    max-width:320px;
    width:85%;
    text-align:center;
    box-shadow:0 0 35px rgba(0,255,255,.25);
    animation:pop .35s ease;
  }
  .popup-warning { background:#ffcc00; box-shadow:0 0 35px rgba(255,215,0,.5); color:#000; }
  .popup-error   { background:#ff4444; box-shadow:0 0 35px rgba(255,0,0,.5); }

  @keyframes pop{
    from{transform:scale(.8);opacity:0}
    to{transform:scale(1);opacity:1}
  }
</style>
</head>
<body>

<!-- Popup Message -->
<div id="popup">
  <div>
    <h2 id="pTitle" style="margin-top:0;"></h2>
    <p id="pText" style="opacity:.9;"></p>
    <button id="pBtn" style="margin-top:14px;padding:10px 24px;background:#0ff;color:#000;border:none;border-radius:14px;font-weight:bold;cursor:pointer;">Close</button>
  </div>
</div>

<!-- UPDATED: Sci-Fi HUD – Floating Transparent Text Only -->
<div class="hud-corner">
  <div class="hud-title">NETWORK LINK</div>
  <div class="network-meter">
    <div>Bandwidth</div>
    <div class="bar-container"><div class="bar" id="netBar"></div></div>
    <div class="speed-text" id="netSpeed">0.00 Mbps</div>
  </div>

  <div class="weather">
    <div class="hud-title">ENVIRONMENTAL</div>
    <div id="weatherLoc">Location</div>
    <div class="weather-temp" id="weatherTemp">--°F</div>
    <div id="weatherCond">Loading...</div>
  </div>
</div>

<!-- Search bar -->
<div class="search-bar" id="searchBar">
  🔍
  <input id="searchInput" placeholder="Search channels...">
</div>

<!-- Floating icon -->
<div class="search-float" id="searchFloat">🔎</div>

<div class="container" id="feed"></div>

<script>
const feed = document.getElementById('feed');
let channels = [];
let activeVideo = null;

const hlsConfig = {
  lowLatencyMode: true,
  liveSyncDurationCount: 2,
  liveMaxLatencyDurationCount: 5,
  maxLiveSyncPlaybackRate: 1.15,
  maxBufferLength: 15,
  maxMaxBufferLength: 20,
  startLevel: -1,
  abrEwmaDefaultEstimate: 500000,
  enableWorker: false,
  liveBackBufferLength: 10,
  nudgeOffset: 0.1,
  nudgeMaxRetry: 10
};

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const section = entry.target;
    const video = section.querySelector('video');
    const loading = section.querySelector('.loading');
    const hls = section._hls;

    if (entry.intersectionRatio >= 0.3) {
      loading.classList.add('show');

      if (!hls && video.dataset.url) {
        if (Hls.isSupported()) {
          const newHls = new Hls(hlsConfig);
          newHls.loadSource(video.dataset.url);
          newHls.attachMedia(video);
          section._hls = newHls;

          newHls.on(Hls.Events.BUFFER_APPENDED, () => {
            if (video.buffered.length > 0 && video.buffered.end(0) - video.currentTime > 1) {
              loading.classList.remove('show');
            }
          });

          newHls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) console.error('HLS fatal error:', data);
          });
        } else {
          video.src = video.dataset.url;
          video.load();
          loading.classList.remove('show');
        }
      } else if (hls) {
        hls.startLoad();
      }

      if (entry.intersectionRatio >= 0.85) {
        if (video !== activeVideo) {
          activeVideo = video;
          document.querySelectorAll('video').forEach(v => {
            if (v === video) {
              v.muted = false;
              v.play().catch(() => {});
            } else {
              v.pause();
            }
          });
        }
        loading.classList.remove('show');
      }
    } else {
      if (hls) {
        hls.stopLoad();
      }
      if (video === activeVideo) {
        video.pause();
      }
    }
  });
}, { threshold: [0, 0.3, 0.85] });

function render(list) {
  feed.innerHTML = '';
  activeVideo = null;

  list.forEach(c => {
    const section = document.createElement('section');
    section.className = 'channel';
    section.innerHTML = `
      <video playsinline data-url="${c.url}" poster="${c.poster || ''}"></video>
      <div class="loading">
        <div class="spinner"></div>
        Loading live stream...
      </div>
      <div class="overlay">
        <span class="live">LIVE</span>
        <div class="name">${c.name}</div>
        <div class="desc">${c.desc}</div>
      </div>`;
    feed.appendChild(section);

    section._hls = null;
    observer.observe(section);
  });
}

// Search logic
const searchBar = document.getElementById('searchBar');
const searchFloat = document.getElementById('searchFloat');
const searchInput = document.getElementById('searchInput');

function hideSearch() {
  searchBar.classList.add('hidden');
  searchFloat.classList.add('show');
}
function showSearch() {
  searchBar.classList.remove('hidden');
  searchFloat.classList.remove('show');
  searchInput.focus();
  autoHide();
}
let hideTimer;
function autoHide() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideSearch, 12000);
}
searchFloat.onclick = showSearch;

searchInput.oninput = () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = channels.filter(c => 
    c.name.toLowerCase().includes(q) || 
    (c.desc && c.desc.toLowerCase().includes(q))
  );
  render(filtered);
};

// Load channels
fetch('channels.json')
  .then(res => res.json())
  .then(data => {
    channels = data;
    render(channels);
    autoHide();
  })
  .catch(err => console.error('Failed to load channels.json', err));

// Popup message
fetch('message.json')
  .then(res => res.json())
  .then(msg => {
    if (msg.enabled) {
      document.getElementById('pTitle').textContent = msg.title || '';
      document.getElementById('pText').textContent = msg.message || '';
      document.getElementById('pBtn').textContent = msg.button || 'Close';

      const popupContainer = document.querySelector('#popup > div');
      popupContainer.className = '';
      if (msg.type === 'warning') popupContainer.classList.add('popup-warning');
      else if (msg.type === 'error') popupContainer.classList.add('popup-error');

      document.getElementById('popup').style.display = 'flex';
    }
  })
  .catch(() => {});

document.getElementById('pBtn').onclick = () => {
  document.getElementById('popup').style.display = 'none';
};

/* === Sci-Fi Network Meter === */
const netBar = document.getElementById('netBar');
const netSpeed = document.getElementById('netSpeed');

function updateNetworkMeter() {
  if ('connection' in navigator) {
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    let speed = 0;
    if (conn) {
      const type = conn.effectiveType;
      const downlink = conn.downlink || 10;
      speed = downlink;

      if (type === '4g') speed = Math.random() * 30 + 50;
      else if (type === '3g') speed = Math.random() * 10 + 10;
      else if (type === 'slow-2g') speed = Math.random() * 1 + 0.5;
    }

    speed += Math.random() * 20;
    speed = Math.min(speed, 150);

    netSpeed.textContent = speed.toFixed(1) + ' Mbps';
    netBar.style.width = (speed / 1.5) + '%';
  } else {
    const fakeSpeed = 40 + Math.random() * 80;
    netSpeed.textContent = fakeSpeed.toFixed(1) + ' Mbps';
    netBar.style.width = (fakeSpeed / 1.5) + '%';
  }
}

setInterval(updateNetworkMeter, 1500);
updateNetworkMeter();

/* === Weather Updater === */
const weatherLocation = "New York";
document.getElementById('weatherLoc').textContent = weatherLocation;

async function updateWeather() {
  try {
    const resp = await fetch(`https://wttr.in/${encodeURIComponent(weatherLocation)}?format=j1`);
    const data = await resp.json();
    const current = data.current_condition[0];
    const tempF = current.temp_F;
    const desc = current.weatherDesc[0].value;

    document.getElementById('weatherTemp').textContent = tempF + '°F';
    document.getElementById('weatherCond').textContent = desc;
  } catch (e) {
    document.getElementById('weatherCond').textContent = 'Offline';
  }
}

updateWeather();
setInterval(updateWeather, 600000); // Every 10 minutes
</script>
</body>
</html>
